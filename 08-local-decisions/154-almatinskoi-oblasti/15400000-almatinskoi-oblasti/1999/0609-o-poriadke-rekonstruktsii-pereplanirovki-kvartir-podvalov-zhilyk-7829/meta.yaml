requisite: Решение акима Алматинской области от 10 июня 1999 года № 6-188. Зарегистрировано Управлением юстиции Алматинской области 19 октября 2000 года № 209. Утратило силу решением акима Алматинской области от 24 ноября 2000 года № 11-342
title:
  rus: О порядке реконструкции (перепланировки) квартир, подвалов, жилых домов и встроенных помещений под объекты предпринимательской деятельности на территории Алматинской области
  kaz: Алматы облысының аумағында пәтерлерді, үйдің жер қабаттарын, тұрғын үйлер мен қосып салынған жайларды кәсіпкерлік қызмет объектілері етіп реконструкциялау (қайта жобалау) тәртібі туралы
