act_code: '7210'
requisite: Решение Алматинского областного маслихата от 12 мая 2000 года № 4-28. Зарегистрировано Управлением юстиции Алматинской области 19 октября 2000 года № 205. Утратило силу решением маслихата Алматинской области от 3 июля 2004 года № 7-60а
title:
  rus: О ходе выполнения Постановления Правительства "О дополнительных мерах по укреплению общественного порядка и повышению роли участковых уполномоченных органов внутренних дел в предупреждении и профилактике правонарушений" и решения акима области № 11-430 по этому вопросу
  kaz: '"Қоғамдық тәртіпті нығайту және тәртіп бұзушылықты болдырмаудың алдын алуда ішкі істер органдары учаскелік уәкілдерінің рөлін көтеруге арналған қосымша шаралар туралы" Қазақстан Республикасы Үкіметі қаулысының және осы мәселе бойынша N 11-430 облыс Әкімі шешімінің орындалу барысы туралы'
