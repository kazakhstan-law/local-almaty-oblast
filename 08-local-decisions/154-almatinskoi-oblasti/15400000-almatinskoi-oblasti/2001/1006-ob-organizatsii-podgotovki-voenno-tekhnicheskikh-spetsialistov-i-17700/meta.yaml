act_code: '17700'
requisite: Решение акима Алматинской области от 7 октября 2001 года № 10-152. Зарегистрировано Управлением юстиции Алматинской области 17 ноября 2003 года № 1366
title:
  rus: Об организации подготовки военно-технических специалистов и комплектовании Талдыкорганского, Уштобинского филиалов Республиканского государственного казенного предприятия «Военно-техническая школа Министерства обороны Республики Казахстан» на 2003-2004 учебный год и мероприятиях, проводимых исполнительными органами по оказанию им помощи.
  kaz: Республикалық мемлекеттік қазыналық "Қазақстан Республикасы Қорғаныс министрлігінің әскери-техникалық мектебі" кәсіпорнының Талдықорған, Үштөбе филиалдарында 2003-2004 оқу жылында әскери-техникалық мамандар дайындауды және жасақтауды ұйымдастыру, сондай-ақ оларға көмек көрсету мақсатында атқарушы органдардың жүргізіп жатқан шаралары туралы
