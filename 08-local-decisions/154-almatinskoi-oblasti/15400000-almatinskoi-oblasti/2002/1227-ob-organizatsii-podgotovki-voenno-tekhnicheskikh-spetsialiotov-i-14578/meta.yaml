act_code: '14578'
requisite: Решение акима Алматинской области от 27 декабря 2002 года № 12-336. Зарегистрировано Управлением юстиции Алматинской области 10 февраля 2003 года № 1004. Утратило силу решением акима Алматинской области от 20 февраля 2007 года № 2-1
title:
  rus: Об организации подготовки военно-технических специалиотов и комплектовании Алматинского, Талдыкорганского, Уштобинского филиалов Республиканского государственного казенного предприятия «Военно-техническая школа Министерства обороны Республики Казахстан» на 2002-2003 учебный год и мероприятиях, проводимых исполнительными органами по оказанию им помощи
  kaz: '"Қазақстан Республикасы Қорғаныс министрлігінің әскери-техникалық мектебі" республикалық мемлекеттік қазыналық кәсіпорнының Алматы, Талдықорған, Үштөбе филиалдарында 2002-2003 оқу жылында әскери-техникалық мамандар дайындауды және жасақтауды ұйымдастыру, сондай-ақ оларға көмек көрсету мақсатында атқарушы органдардың жүргізіп жатқан шаралары туралы'
