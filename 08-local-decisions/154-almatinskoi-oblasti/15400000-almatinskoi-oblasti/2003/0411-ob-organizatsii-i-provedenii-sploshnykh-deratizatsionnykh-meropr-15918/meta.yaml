act_code: '15918'
requisite: Решение акима Алматинской области от 12 апреля 2003 года № 16. Зарегистрировано Управлением юстиции Алматинской области 23 мая 2003 года № 1161. Утратило силу решением акима Алматинской области от 23 февраля 2004 года № 23
title:
  rus: «Об организации и проведении сплошных дератизационных мероприятий в населенных пунктах Алматинской области, находящихся в зоне активно действующих природных очагов чумы и туляремии и проведении истребительных мероприятий малярийных комаров на анофелогенных площадях Капшагайского водохранилища»
  kaz: Алматы облысының оба және туляремия ауруларының белсенді түрде тұрақты әсер ететін табиғи ошақтарында орналасқан елді мекендерде жаппай дератизациялау шараларын ұйымдастыру және Қапшағай су қоймасындағы анофелогенді алаңдарда безгек ауруын тарататын масаны қырып-жою шараларын өткізу туралы
