requisite: Решение маслихата Алматинской области от 30 мая 2003 года № 34-192. Зарегистрировано Управлением юстиции Алматинской области 6 июня 2003 года № 1186. Утратило силу решением маслихата Алматинской области от 14 января 2005 года № 14-101
title:
  rus: Об утверждении Правил предоставления социальной помощи малообеспеченным семьям, являющимися получателями государственной адресной социальной помощи, для развития личного подсобного хозяйства
  kaz: Мемлекеттік атаулы әлеуметтік көмекті алушы аз қамтамасыз етілген отбасыларына жеке шаруашылыққа мал, тұқым сатып алуға, халық кәсіпшілігін дамытуға, жеке меншік іс ашуға, оның ішінде кәсіптік оқудан өткендерге де әлеуметтік көмек көрсету Ережелерін бекіту туралы
