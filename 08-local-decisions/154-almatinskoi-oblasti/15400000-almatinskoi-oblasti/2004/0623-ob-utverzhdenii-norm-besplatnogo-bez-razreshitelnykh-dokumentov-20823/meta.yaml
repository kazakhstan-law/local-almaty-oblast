title:
  rus: Об утверждении норм бесплатного, без разрешительных документов сбора физическими лицами для собственных нужд на территории Государственного лесного фонда дикорастущих плодов, орехов, грибов, ягод лекарственного сырья, иных лесных ресурсов
  kaz: Мемлекеттік орман қоры аумағында жеке тұлғалардың өз қажеттіліктеріне ақысыз, рұқсат беру құжаттарынсыз жабайы жеміс, жаңғақ, саңырауқұлақ, дәрілік шикізат бүлдіргендерді және орман ресурстарын жинау нормаларын бекіту туралы
