  title:
    rus: О внесении изменения в решение Алматинского областного маслихата от 24 июня 2004 года № 7-55  «Об утверждении норм бесплатного, без разрешительных документов сбора физическими лицами на территории Государственного лесного фонда для собственных нужд дикорастущих плодов, орехов, грибов, ягод, лекарственного сырья,  иных лесных ресурсов»
    kaz: Алматы облыстық мәслихатының 2004 жылғы 24 маусымдағы № 7-55 «Мемлекеттік орман қоры аумағында жеке тұлғалардың өз қажеттіліктеріне ақысыз, рұқсат беру құжаттарынсыз жабайы жеміс, жаңғақ, саңырауқұлақ, дәрілік шикізат бүлдіргендерді және орман ресурстарын жинау нормаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
