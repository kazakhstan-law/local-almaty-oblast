requisite: Алматы облыстық мәслихатының 2004 жылғы 21 желтоқсандағы № 13-80 шешімі. Алматы облыстық Әділет Департаментінің 2005 жылғы 21 қаңтарда № 1843 тіркелді. Күші жойылды - Алматы облыстық мәслихатының 2008 жылғы 29 желтоқсандағы № 16-105 шешімімен
