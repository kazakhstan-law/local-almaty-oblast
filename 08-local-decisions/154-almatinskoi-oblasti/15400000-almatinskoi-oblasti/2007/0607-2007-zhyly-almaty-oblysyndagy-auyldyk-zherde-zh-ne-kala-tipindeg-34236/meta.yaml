requisite: Алматы облыстық мәслихатының 2007 жылғы 7 маусымдағы № 39-302 шешімі. Алматы облыстық Әділет департаментінде 2007 жылғы 19 шілдеде № 1990 тіркелген. Күші жойылды - Алматы облыстық мәслихатының 2008 жылғы 29 желтоқсандағы № 16-105 шешімімен
title:
