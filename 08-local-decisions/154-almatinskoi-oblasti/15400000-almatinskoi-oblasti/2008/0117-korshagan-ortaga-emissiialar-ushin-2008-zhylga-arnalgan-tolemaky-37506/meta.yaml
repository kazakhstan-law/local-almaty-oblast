requisite: Алматы облыстық мәслихатының 2008 жылғы 17 қаңтардағы № 6-35 шешімі. Алматы облысының Әділет департаментінде 2008 жылы 7 ақпанда № 2001 тіркелген. Күші жойылды - Алматы облыстық мәслихатының 2008 жылғы 29 желтоқсандағы № 16-105 шешімімен
