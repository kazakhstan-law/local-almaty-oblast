requisite: Решение Алматинского областного маслихата от 2 декабря 2014 года № 39-223. Зарегистрировано Департаментом юстиции Алматинской области 8 декабря 2014 года № 2954. Утратило силу решением маслихата Алматинской области от 8 августа 2022 года № 24-118
title:
  rus: Об установлении размера возмещения за счет бюджетных средств расходов на коммунальные услуги и топливо медицинским и фармацевтическим работникам организаций государственного сектора здравоохранения, работающим в сельской местности и поселках городского типа
  kaz: Мемлекеттік денсаулық сақтау секторы ұйымдарының ауылдық жерде және қала үлгісіндегі кенттерде жұмыс істейтін медицина және фармацевтика қызметкерлеріне коммуналдық қызметтерге және отынға арналған шығыстарды бюджет қаражаты есебінен өтеу мөлшерін белгілеу туралы
