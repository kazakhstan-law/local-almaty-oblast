act_code: '193038'
requisite: Решение маслихата Алматинской области от 31 января 2024 года № 15-74. Зарегистрировано Департаментом юстиции Алматинской области 2 февраля 2024 года № 6082-05
title:
  rus: О предоставлении бесплатного или льготного проезда гражданам Республики Казахстан проживающим в Алматинской области за пределы населенного пункта постоянного проживания для получения высокотехнологичных медицинских услуг в рамках гарантированного объема бесплатной медицинской помощи и (или) медицинской помощи в системе обязательного социального медицинского страхования
  kaz: Тегін медициналық көмектің кепілдік берілген көлемі шеңберінде жоғары технологиялық медициналық көрсетілетін қызметтерді және (немесе) міндетті әлеуметтік медициналық сақтандыру жүйесінде медициналық көмекті алу үшін Алматы облысында тұратын Қазақстан Республикасының азаматтарына тұрақты тұратын елді мекеннен тысқары жерлерге тегін немесе жеңілдікті жол жүруді ұсыну туралы
