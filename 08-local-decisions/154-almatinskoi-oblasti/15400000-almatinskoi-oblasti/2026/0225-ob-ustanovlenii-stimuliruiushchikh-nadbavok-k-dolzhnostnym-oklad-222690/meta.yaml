  requisite: Решение маслихата Алматинской области от 22 апреля 2026 года № 49-282
  title:
    rus: О внесении изменений в решение Алматинского областного маслихата № 46-262 от 25 февраля 2026 года «Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Учебно-методический центр психологической поддержки по Алматинской области» государственного учреждения «Управление образования Алматинской области» финансируемого из местного бюджета
    kaz: Алматы облыстық мәслихатының 2026 жылғы 25 ақпандағы № 46-262 «Жергілікті бюджеттен қаржыландырылатын «Алматы облысының білім басқармасы» мемлекеттік мекемесінің «Алматы облысы бойынша психологиялық қолдау оқу - әдістемелік орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы» шешіміне өзгерістер енгізу туралы
