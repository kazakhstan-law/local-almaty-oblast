title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Учебно-методический центр психологической поддержки по Алматинской области» государственного учреждения «Управление образования Алматинской области» финансируемого из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын «Алматы облысының білім басқармасы» мемлекеттік мекемесінің «Алматы облысы бойынша психологиялық қолдау оқу-әдістемелік орталығы» коммуналдық мемлекеттік мекемесі жұмыскерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
