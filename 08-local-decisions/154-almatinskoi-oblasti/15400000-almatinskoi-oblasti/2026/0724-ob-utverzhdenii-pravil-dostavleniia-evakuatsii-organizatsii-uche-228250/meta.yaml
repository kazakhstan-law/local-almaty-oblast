act_code: '228250'
requisite: Решение Алматинского областного маслихата от 24 июля 2026 года № 52-307. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 июля 2026 года № 39403
title:
  rus: Об утверждении Правил доставления (эвакуации), организации учета и временного хранения автомобильного транспортного средства, судна, в том числе маломерного судна, задержанного на основании, предусмотренном законодательством Республики Казахстан об административных правонарушениях, на специальных площадках или стоянках, создаваемых по решению местных исполнительных органов Алматинской области и находящихся в коммунальной собственности
  kaz: Қазақстан Республикасының әкімшілік құқық бұзушылық туралы заңнамасында көзделген негізде, Алматы облысының жергілікті атқарушы органдарының шешімі бойынша құрылатын және коммуналдық меншіктегі арнаулы алаңдарда немесе тұрақтарда ұсталған автомобиль көлік құралын, кемені, оның ішінде шағын көлемді кемені жеткізу (эвакуациялау), есепке алуды және уақытша сақтауды ұйымдастыру қағидаларын бекіту туралы
