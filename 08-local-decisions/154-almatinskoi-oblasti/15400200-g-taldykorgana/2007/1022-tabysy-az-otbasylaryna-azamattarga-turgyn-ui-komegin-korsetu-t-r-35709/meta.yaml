requisite: Алматы облысы Талдықорған қалалық мәслихатының 2007 жылғы 22 қазандағы № 12 шешімі. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2007 жылы 12 қарашада № 2-1-56 тіркелді. Күші жойылды - Алматы облысы Талдықорған қалалық мәслихатының 2010 жылғы 14 сәуірдегі № 173 шешімімен
