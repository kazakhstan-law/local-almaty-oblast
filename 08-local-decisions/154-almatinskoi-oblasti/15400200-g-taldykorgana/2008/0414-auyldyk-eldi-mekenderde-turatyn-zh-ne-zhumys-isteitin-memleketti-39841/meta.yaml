requisite: Алматы облысы Талдықорған қаласы мәслихатының 2008 жылғы 14 сәуірдегі № 48 шешімі. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2008 жылы 23 мамырда № 2-1-82 тіркелді. Күші жойылды - Алматы облысы Талдықорған қалалық мәслихатының 2012 жылғы 21 қарашадағы № 91 шешімімен
title:
