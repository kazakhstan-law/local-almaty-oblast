act_code: '43348'
requisite: Алматы облысы Талдықорған қаласы әкімінің 2008 жылғы 25 желтоқсандағы № 32 шешімі. Алматы облысының Әділет департаменті Талдықорған қаласының әділет басқармасында 2009 жылғы 13 қаңтарда № 2-1-92 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімінің 2009 жылғы 17 маусымдағы № 9 шешімімен
