requisite: Алматы облысы Талдықорған қаласы әкімінің 2009 жылғы 21 желтоқсандағы № 22 шешімі. Алматы облысының әділет департаменті Талдықорған қаласының әділет басқармасында 2010 жылы 19 қаңтарда № 2-1-111 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімінің 2010 жылғы 09 шілдедегі № 8 Шешімімен
