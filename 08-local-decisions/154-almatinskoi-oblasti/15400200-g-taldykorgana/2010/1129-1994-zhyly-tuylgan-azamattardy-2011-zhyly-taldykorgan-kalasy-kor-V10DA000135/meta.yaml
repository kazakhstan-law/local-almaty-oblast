requisite: Алматы облысы Талдықорған қаласы әкімінің 2010 жылғы 29 қарашадағы № 11 шешімі. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2011 жылы 06 қаңтарда № 2-1-135 тіркелді. Күші жойылды - Алматы облысы Талдықорған қаласы әкімінің 2011 жылғы 28 сәуірдегі № 7 шешімімен
