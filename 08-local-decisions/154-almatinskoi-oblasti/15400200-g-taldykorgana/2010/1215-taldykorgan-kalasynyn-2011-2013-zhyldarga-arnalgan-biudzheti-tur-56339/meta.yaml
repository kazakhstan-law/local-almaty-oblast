act_code: '56339'
requisite: Алматы облысы Талдықорған қалалық мәслихатының 2010 жылғы 15 желтоқсандағы № 212 шешімі. Алматы облысының Әділет департаменті Талдықорған қаласының Әділет басқармасында 2010 жылы 30 желтоқсанда № 2-1-134 тіркелді. Күші жойылды - Алматы облысы Талдықорған қалалық мәслихатының 2012 жылғы 22 мамырдағы № 44 шешімімен
