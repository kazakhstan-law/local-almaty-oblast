act_code: '65547'
requisite: Решение от 10.04.2012 №39, Маслихат г. Талдыкоргана. Утратило силу решением Талдыкорганского городского маслихата Алматинской области от 27.05.2015 № 320
title:
  rus: 'ИМПОРТ: Об установлении специалистам города Талдыкорган, работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате'
  kaz: 'ИМПОРТ: Талдықорған қаласы бойынша ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы'
