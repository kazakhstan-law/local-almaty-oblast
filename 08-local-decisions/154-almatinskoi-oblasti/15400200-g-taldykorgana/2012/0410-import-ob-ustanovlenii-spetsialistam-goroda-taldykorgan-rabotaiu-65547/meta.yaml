  title:
    rus: 'ИМПОРТ: О внесении изменений в решение Талдыкорганского городского маслихата от 10 апреля 2012 года N 39 "Об установлении специалистам города Талдыкорган, работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате"'
    kaz: 'ИМПОРТ: Талдықорған қалалық мәслихатының 2012 жылғы 10 сәуірдегі "Талдықорған қаласы бойынша ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы" N 39 шешіміне өзгеріс енгізу туралы'
