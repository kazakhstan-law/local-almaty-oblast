act_code: '69273'
requisite: Решение маслихата города Талдыкорган Алматинской области от 21 ноября 2012 года № 91. Зарегистрировано Департаментом юстиции Алматинской области 12 декабря 2012 года № 2239. Утратило силу решением Талдыкорганского городского маслихата Алматинской области от 15 октября 2014 года № 268
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах города Талдыкоргана
  kaz: Талдықорған қаласының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
