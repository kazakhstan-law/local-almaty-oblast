act_code: '80306'
requisite: Решение Талдыкорганского городского маслихата Алматинской области от 18 апреля 2014 года № 224. Зарегистрировано Департаментом юстиции Алматинской области 23 мая 2014 года № 2733. Утратило силу решением маслихата города Талдыкорган области Жетісу от 15 ноября 2023 года № 11-69
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества  и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории города Талдыкорган
  kaz: Талдықорған қаласының аумағында бөлек жергілікті қоғамдастық жиындарын  өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп  пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
