requisite: Решение Талдыкорганского городского маслихата Алматинской области от 27 мая 2015 года № 320. Зарегистрировано Департаментом юстиции Алматинской области 17 июня 2015 года № 3229. Утратило силу решением Талдыкорганского городского маслихата Алматинской области от 16 марта 2021 года № 25
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах города Талдыкорган
  kaz: Талдықорған қаласының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
