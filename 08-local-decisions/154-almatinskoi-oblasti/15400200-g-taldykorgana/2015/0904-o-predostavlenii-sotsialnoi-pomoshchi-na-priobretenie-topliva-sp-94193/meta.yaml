requisite: Решение Талдыкорганского городского маслихата Алматинской области от 04 сентября 2015 года № 338. Зарегистрировано Департаментом юстиции Алматинской области 29 сентября 2015 года № 3456. Утратило силу решением Талдыкорганского городского маслихата Алматинской области от 2 июня 2020 года № 394
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах города Талдыкорган
  kaz: Талдықорған қаласының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алуға әлеуметтік көмек беру туралы
