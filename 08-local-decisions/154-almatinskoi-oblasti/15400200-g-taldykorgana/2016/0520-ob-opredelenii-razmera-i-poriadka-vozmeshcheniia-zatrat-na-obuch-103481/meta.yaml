requisite: Решение Талдыкорганского городского маслихата Алматинской области от 20 мая 2016 года № 25. Зарегистрировано Департаментом юстиции Алматинской области 15 июня 2016 года № 3889. Утратило силу решением Талдыкорганского городского маслихата Алматинской области от 7 октября 2020 года № 433
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Талдыкорган
