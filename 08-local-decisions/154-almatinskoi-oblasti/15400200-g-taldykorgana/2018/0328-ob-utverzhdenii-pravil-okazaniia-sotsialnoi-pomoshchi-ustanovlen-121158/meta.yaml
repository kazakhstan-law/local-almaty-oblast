  title:
    rus: О внесении изменений в решение Талдыкорганского городского маслихата от 28 марта 2018 года № 167 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Талдыкорган»
    kaz: Талдықорған қалалық мәслихатының 2018 жылғы 28 наурыздағы № 167 «Талдықорған қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы»  шешіміне өзгерістер енгізу туралы
