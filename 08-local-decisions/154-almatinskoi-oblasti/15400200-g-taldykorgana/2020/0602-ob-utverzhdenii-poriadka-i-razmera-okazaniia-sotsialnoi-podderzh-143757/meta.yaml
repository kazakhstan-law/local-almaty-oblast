act_code: '143757'
requisite: Решение Талдыкорганского городского маслихата Алматинской области от 2 июня 2020 года № 394. Зарегистрировано Департаментом юстиции Алматинской области 11 июня 2020 года № 5540
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Талдыкорган
  kaz: Талдықорған қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету  тәртібін және мөлшерін бекіту туралы
