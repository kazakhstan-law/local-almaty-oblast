requisite: Решение Талдыкорганского городского маслихата Алматинской области от 7 октября 2020 года № 433. Зарегистрировано Департаментом юстиции Алматинской области 19 октября 2020 года № 5710. Утратило силу решением маслихата города Талдыкорган области Жетісу от 22 мая 2023 года № 3-22
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Талдыкорган
  kaz: Талдықорған қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы
