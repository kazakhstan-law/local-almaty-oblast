act_code: '37807'
requisite: Алматы облысы Алакөл аудандық мәслихатының 2008 жылғы 28 қаңтардағы № 4-4 шешімі. Алматы облысының әділет департаменті Алакөл ауданының әділет басқармасында 2008 жылы 13 ақпанда № 2-5-57 тіркелген. Күші жойылды - Алматы облысы Алакөл аудандық мәслихатының 2009 жылғы 26 қарашадағы № 24-2 шешімімен және Алакөл ауданы әкімдіктің № 12-3 қаулысымен
title:
