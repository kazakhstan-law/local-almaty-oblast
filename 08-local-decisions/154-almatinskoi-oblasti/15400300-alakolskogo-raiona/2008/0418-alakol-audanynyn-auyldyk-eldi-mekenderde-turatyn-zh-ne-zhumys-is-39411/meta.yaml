act_code: '39411'
requisite: Алматы облысы Алакөл аудандық мәслихатының 2008 жылғы 18 сәуірдегі № 6-2 шешімі. Алматы облысы әділет департаменті Алакөл ауданының әділет басқармасында 2008 жылы 6 мамырда № 2-5-60 тіркелді. Күші жойылды - Алматы облысы Алакөл аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 13-8 шешімімен
title:
  rus: Алакөл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
  kaz: Алакөл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
