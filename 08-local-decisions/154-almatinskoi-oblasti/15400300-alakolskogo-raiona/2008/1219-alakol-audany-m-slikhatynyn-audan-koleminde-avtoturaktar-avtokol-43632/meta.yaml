requisite: Алматы облысы Алакөл аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 13-2 шешімі. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2009 жылғы 20 қаңтарда № 2-5-69 тіркелді. Күші жойылды - Алматы облысы Алакөл аудандық мәслихатының 2009 жылғы 20 наурыздағы № 16-1 шешімімен
