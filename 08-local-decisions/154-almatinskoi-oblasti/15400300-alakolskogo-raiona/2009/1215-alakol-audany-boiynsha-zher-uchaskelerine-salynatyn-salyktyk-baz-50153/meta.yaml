requisite: Алматы облысы Алакөл аудандық мәслихатының 2009 жылғы 15 желтоқсандағы № 25-2 шешімі. Алматы облысының әділет департаменті Алакөл ауданының әділет басқармасында 2010 жылы 22 қаңтарда № 2-5-79 тіркелді. Күші жойылды - Алматы облысы Алакөл аудандық мәслихатының 2011 жылғы 19 қаңтардағы № 34-3 шешімімен
