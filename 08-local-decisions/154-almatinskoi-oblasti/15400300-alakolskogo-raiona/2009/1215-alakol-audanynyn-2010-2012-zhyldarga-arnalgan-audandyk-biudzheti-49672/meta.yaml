requisite: Алматы облысы Алакөл аудандық мәслихатының 2009 жылғы 15 желтоқсандағы № 25-1 шешімі. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2009 жылы 30 желтоқсанда № 2-5-76 тіркелді. Күші жойылды - Алматы облысы Алакөл аудандық мәслихатының 2011 жылғы 19 қаңтардағы № 34-3 шешімімен
