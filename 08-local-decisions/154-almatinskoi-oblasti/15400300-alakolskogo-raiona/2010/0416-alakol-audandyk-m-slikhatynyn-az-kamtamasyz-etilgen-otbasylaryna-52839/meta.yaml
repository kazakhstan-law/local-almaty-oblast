requisite: Алматы облысы Алакөл аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 27-11 шешімі. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2010 жылы 20 мамырда № 2-5-85 тіркелді. Күші жойылды - Алакөл аудандық мәслихатының 2011 жылғы 19 қаңтардағы № 34-3 шешімімен
