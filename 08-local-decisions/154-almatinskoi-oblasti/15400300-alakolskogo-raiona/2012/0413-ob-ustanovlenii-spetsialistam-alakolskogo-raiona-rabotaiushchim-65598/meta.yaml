requisite: Решение маслихата Алакольского района Алматинской области от 13 аперля 2012 года № 3-6. Зарегистрировано Управлением юстиции Алакольского района Департамента юстиции Алматинской области 14 мая 2012 года № 2-5-172. Утратило силу - Решением маслихата Алакольского района Алматинской области от 05 декабря 2012 года № 10-2
title:
  rus: Об установлении специалистам, Алакольского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Алакөл ауданы бойынша ауылдық елді мекендерде жұсмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес пайыз жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
