act_code: '69169'
requisite: Решение маслихата Алакольского района Алматинской области от 05 декабря 2012 года № 10-2. Зарегистрировано Департаментом юстиции Алматинской области 11 декабря 2012 года № 2225. Утратило силу решением Алакольского районного маслихата Алматинской области от 20 июля 2016 года № 6-4
title:
  rus: Об установлении специалистам, Алакольского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Алакөл ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
