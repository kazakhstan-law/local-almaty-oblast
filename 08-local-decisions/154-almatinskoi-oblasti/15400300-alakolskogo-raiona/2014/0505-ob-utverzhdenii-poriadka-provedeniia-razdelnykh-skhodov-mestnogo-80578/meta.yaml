requisite: Решение Алакольского районного маслихата Алматинской области от 05 мая 2014 года № 31-5. Зарегистрировано Департаментом юстиции Алматинской области 26 мая 2014 года № 2735. Утратило силу решением Алакольского районного маслихата области Жетісу от 30 ноября 2023 года № 16-2
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества  и определения количества представителей жителей города,села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Алакольском районе
  kaz: Алакөл ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін қала, ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
