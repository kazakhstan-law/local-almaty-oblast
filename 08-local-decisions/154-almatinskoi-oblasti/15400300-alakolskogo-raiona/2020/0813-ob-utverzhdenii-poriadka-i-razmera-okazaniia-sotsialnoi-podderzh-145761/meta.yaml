act_code: '145761'
requisite: Решение Алакольского районного маслихата Алматинской области от 13 августа 2020 года № 74-2. Зарегистрировано Департаментом юстиции Алматинской области 24 августа 2020 года № 5628
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Алакольского района
  kaz: Алакөл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету  тәртібін және мөлшерін бекіту туралы
