act_code: '148147'
requisite: Решение Алакольского районного маслихата Алматинской области от 21 октября 2020 года № 76-1. Зарегистрировано Департаментом юстиции Алматинской области 3 ноября 2020 года № 5726
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Алакольском районе
  kaz: Алакөл ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
