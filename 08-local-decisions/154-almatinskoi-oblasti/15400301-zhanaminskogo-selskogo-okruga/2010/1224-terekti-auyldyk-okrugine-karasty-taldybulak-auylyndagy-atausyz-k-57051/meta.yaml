requisite: Алматы облысы Алакөл ауданы Теректі ауылдық округі әкімінің 2010 жылғы 24 желтоқсандағы № 33 шешімі. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2011 жылы 28 қаңтарда № 2-5-142 тіркелді
