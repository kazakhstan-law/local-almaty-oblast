requisite: Алматы облысы Алакөл ауданы Ынталы ауылдық округі әкімінің 2010 жылғы 16 тамыздағы № 07 шешімі. Алматы облысының Әділет департаменті Алакөл ауданының Әділет басқармасында 2010 жылы 22 қыркүйекте № 2-5-115 тіркелді. Күші жойылды - Алматы облысы Алакөл ауданы Ынталы ауылдық округі әкімінің 2010 жылғы 01 қарашадағы № 12 шешімімен
