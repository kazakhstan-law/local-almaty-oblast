requisite: Алматы облысы Панфилов аудандық мәслихатының 2008 жылғы 23 шілдедегі № 4-9-59 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының әділет басқармасында 2008 жылы 26 тамызда № 2-16-70 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2014 жылғы 05 желтоқсандағы № 5-41-270 шешімімен
