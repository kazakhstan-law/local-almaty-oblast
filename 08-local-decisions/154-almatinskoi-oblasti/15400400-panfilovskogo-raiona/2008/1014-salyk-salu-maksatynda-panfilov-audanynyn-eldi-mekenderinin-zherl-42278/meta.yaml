requisite: Алматы облысы Панфилов аудандық мәслихатының 2008 жылғы 14 қазандағы № 4-10-72 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2008 жылы 14 қарашада № 2-16-72 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 22 сәуірдегі № 4-19-124 шешімімен
