requisite: Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 4 ақпандағы N 4-15-100 шешімі. Алматы облысы әділет департаменті Панфилов ауданының әділет басқармасында 2009 жылы 4 ақпанда тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 27 наурыздағы № 4-17-112 шешімімен
