requisite: Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 21 шілдедегі N 4-20-133 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының әділет басқармасында 2009 жылы 12 тамызда 2-16-89 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 21 желтоқсандағы № 4-25-165 шешімімен
