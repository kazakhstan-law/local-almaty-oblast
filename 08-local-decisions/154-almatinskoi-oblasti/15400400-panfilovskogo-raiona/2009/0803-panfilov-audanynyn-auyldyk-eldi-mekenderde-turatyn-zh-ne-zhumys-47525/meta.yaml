requisite: Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 3 тамыздағы N 4-21-139 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2009 жылы 26 тамызда N 2-16-92 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2009 жылғы 21 желтоқсандағы № 4-25-165 шешімімен
