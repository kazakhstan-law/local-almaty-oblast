requisite: Алматы облысы Панфилов аудандық мәслихатының 2010 жылғы 23 қыркүйектегі № 4-33-212 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2010 жылы 18 қазанда № 2-16-121 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2010 жылғы 22 желтоқсандағы № 4-38-243 шешімімен
