requisite: Алматы облысы Панфилов аудандық мәслихатының 2010 жылғы 23 қарашадағы № 4-35-220 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2010 жылы 29 қарашада № 2-16-124 тіркелді. Күші жойылды - Алматы облысы Панфилов аудандық мәслихатының 2012 жылғы 11 маусымдағы № 5-6-39 шешімімен
