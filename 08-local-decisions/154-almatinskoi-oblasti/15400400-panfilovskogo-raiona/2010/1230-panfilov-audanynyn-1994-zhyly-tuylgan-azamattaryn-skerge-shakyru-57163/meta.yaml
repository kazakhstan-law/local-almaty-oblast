requisite: Алматы облысы Панфилов ауданы әкімінің 2010 жылғы 30 желтоқсандағы № 12-13 шешімі. Алматы облысының Әділет департаменті Панфилов ауданының Әділет басқармасында 2011 жылы 28 қаңтарда № 2-16-131 тіркелді. Күші жойылды - Алматы облысы Панфилов ауданы әкімінің 2012 жылғы 09 қаңтардағы № 01-01 шешімімен
