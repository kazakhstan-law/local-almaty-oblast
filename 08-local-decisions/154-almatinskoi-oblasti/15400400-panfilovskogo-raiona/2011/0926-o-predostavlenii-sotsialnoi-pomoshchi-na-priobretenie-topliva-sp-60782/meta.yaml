  kaz: Панфилов ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру және мәдениет ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
