requisite: Решение маслихата Панфиловского района Алматинской области от 26 сентября 2011 года № 4-51-310. Зарегистрировано Управлением юстиции Панфиловского района Департамента юстиции Алматинской области 11 октября 2011 года № 2-16-137. Утратило силу решением маслихата Панфиловского района Алматинской области от 20 декабря 2011 года № 4-55-344
title:
