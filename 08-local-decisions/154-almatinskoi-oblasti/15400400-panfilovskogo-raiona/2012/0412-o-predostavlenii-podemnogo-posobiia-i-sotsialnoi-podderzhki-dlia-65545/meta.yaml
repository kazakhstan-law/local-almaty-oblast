requisite: Решение маслихата Панфиловского района Алматинской области от 12 апреля 2012 года № 5-4-26. Зарегистрировано Управлением юстиции Панфиловского района Департамента юстиции Алматинской области 07 мая 2012 года № 2-16-155. Утратило силу решением маслихата Панфиловского района Алматинской области от 12 апреля 2013 года № 5-15-116
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Панфиловского района
  kaz: Панфилов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
