act_code: '65544'
requisite: Решение маслихата Панфиловского района Алматинской области от 12 апреля 2012 года № 5-4-25. Зарегистрировано Управлением юстиции Панфиловского района Департамента юстиции Алматинской области 07 мая 2012 года № 2-16-154. Утратило силу решением Панфиловского районного маслихата Алматинской области от 05 декабря 2014 года № 5-41-270
title:
  rus: Об установлении специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельских населенных пунктах Панфиловского района повышенные на двадцать пять процентов оклады и тарифные ставки
  kaz: Панфилов ауданының ауылдық елді мекендерінде жұсмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
