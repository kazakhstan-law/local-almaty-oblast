requisite: Решение маслихата Панфиловского района Алматинской области от 02 ноября 2012 года № 5-11-78. Зарегистрировано Департаментом юстиции Алматинской области 15 ноября 2012 года № 2189. Утратило силу решением Панфиловского районного маслихата Алматинской области от 14 октября 2014 года № 5-38-252
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Панфиловского района
  kaz: Панфилов ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
