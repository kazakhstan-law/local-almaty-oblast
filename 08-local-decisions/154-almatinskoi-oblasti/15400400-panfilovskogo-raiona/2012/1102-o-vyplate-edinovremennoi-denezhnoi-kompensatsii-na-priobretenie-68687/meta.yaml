requisite: Решение маслихата Панфиловского района Алматинской области от 02 ноября 2012 года № 5-11-79. Зарегистрировано Департаментом юстиции Алматинской области 15 ноября 2012 года № 2190. Утратило силу решением Панфиловского районного маслихата Алматинской области от 31 октября 2014 года № 5-39-261
title:
