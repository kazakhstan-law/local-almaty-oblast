act_code: '72208'
requisite: Решение маслихата Панфиловского района Алматинской области от 12 апреля 2013 года N 5-15-116. Зарегистрировано Департаментом юстиции Алматинской области 23 апреля 2013 года N 2344. Утратило силу решением маслихата Панфиловского района Алматинской области от 02 апреля 2014 года N 5-28-195
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Панфиловского района
  kaz: Панфилов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
