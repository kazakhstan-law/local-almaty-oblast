act_code: '79381'
requisite: Решение маслихата Панфиловского района Алматинской области от 02 апреля 2014 года N 5-28-195. Зарегистрировано Департаментом юстиции Алматинской области 24 апреля 2014 года N 2679. Утратило силу решением Панфиловского районного маслихата области Жетісу от 26 апреля 2024 года № 8-22-103
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и  агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Панфиловского района
  kaz: Панфилов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
