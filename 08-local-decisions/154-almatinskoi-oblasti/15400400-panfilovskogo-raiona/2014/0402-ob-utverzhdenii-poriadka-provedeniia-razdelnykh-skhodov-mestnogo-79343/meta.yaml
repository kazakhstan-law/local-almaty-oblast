act_code: '79343'
requisite: Решение маслихата Панфиловского района Алматинской области от 02 апреля 2014 года N 5-28-197. Зарегистрировано Департаментом юстиции Алматинской области 24 апреля 2014 года N 2678. Утратило силу решением Панфиловского районного маслихата области Жетісу от 3 ноября 2023 года № 8-11-53
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Панфиловском районе
  kaz: Панфилов ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын  үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
