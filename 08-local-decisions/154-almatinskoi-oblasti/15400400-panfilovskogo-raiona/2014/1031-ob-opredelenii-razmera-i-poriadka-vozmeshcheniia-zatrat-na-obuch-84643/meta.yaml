requisite: Решение Панфиловского районного маслихата Алматинской области от 31 октября 2014 года № 5-39-258. Зарегистрировано Департаментом юстиции Алматинской области 17 ноября 2014 года № 2921. Утратило силу решением Панфиловского районного маслихата Алматинской области от 19 мая 2016 года № 6-4-32
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Панфиловском районе
