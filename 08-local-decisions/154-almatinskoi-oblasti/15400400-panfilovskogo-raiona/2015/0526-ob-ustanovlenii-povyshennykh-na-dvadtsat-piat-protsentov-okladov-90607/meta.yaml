requisite: Решение Панфиловского районного маслихата Алматинской области от 26 мая 2015 года № 5-49-336. Зарегистрировано Департаментом юстиции Алматинской области 16 июня 2015 года № 3222. Утратило силу решением Панфиловского районного маслихата Алматинской области от 28 сентября 2020 года № 6-76-424
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Панфиловского района
  kaz: Панфилов ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
