  title:
    rus: О внесении изменений в решение Панфиловского районного маслихата от 28 сентября 2020 года № 6-76-424 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Панфиловского района»
    kaz: Панфилов аудандық мәслихатының 2020 жылғы 28 қыркүйектегі № 6-76-424 «Панфилов ауданында азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/155904/rus
