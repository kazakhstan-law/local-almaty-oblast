requisite: Решение Панфиловского районного маслихата Алматинской области от 6 октября 2021 года № 7-6-62. Зарегистрировано в Министерстве юстиции Республики Казахстан 15 октября 2021 года № 24788. Утратило силу решением Панфиловского районного маслихата области Жетісу от 3 ноября 2023 года № 8-11-56
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Панфиловском районе
