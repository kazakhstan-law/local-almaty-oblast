act_code: '31183'
requisite: Алматы облысы Сарқан аудандық мәслихатының 2006 жылғы 20 желтоқсандағы № 44-250 шешімі. Алматы облысының Әділет департаменті Сарқан ауданының Әділет басқармасында 2007 жылы 4 қаңтарда № 2-17-33 болып тіркелді
title:
  rus: Сарқан ауданындағы автотұрақтар, автокөліктерге май құю станциялары және базарлар орналасқан жер учаскелеріне 2007 жылы салынатын салық ставкалары туралы
