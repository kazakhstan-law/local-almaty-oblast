  requisite: Постановление акимата Атбасарского района Акмолинской области от 20 ноября 2009 года № а-11/301. Зарегистрировано Управлением юстиции Атбасарского района Акмолинской области 23 декабря 2009 года № 1-5-126. Утратило силу - постановлением акимата Атбасарского района Акмолинской области от 4 февраля 2010 года № а-2/28
  title:
    rus: О внесении изменения в постановление акимата Атбасарского района от 4 июня 2009 года № а-6/143 "Об организации и обеспечении очередного призыва граждан на срочную воинскую службу в апреле-июне и октябре-декабре 2009 года"
    kaz: Атбасар ауданы әкімдігінің 2009 жылғы 4 маусымдағы № а-6/143 "2009 жылдың сәуір-маусымында және қазан-желтоқсанында" азаматтарды мерзімді әскери қызметке кезекті шақыруды ұйымдастыру және қамтамасыз ету туралы" қаулысына өзгеріс енгізу туралы
