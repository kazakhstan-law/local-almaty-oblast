act_code: '66658'
requisite: Решение маслихата Сарканского района Алматинской области от 25 июня 2012 года № 7-44. Зарегистрировано Управлением юстиции Сарканского района Департамента юстиции Алматинской области 12 июля 2012 года № 2-17-120. Утратило силу решением Сарканского районного маслихата Алматинской области от 28 мая 2020 года № 81-317
title:
  rus: Об установлении специалистам Сарканского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения,  образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Сарқан ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандаринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
