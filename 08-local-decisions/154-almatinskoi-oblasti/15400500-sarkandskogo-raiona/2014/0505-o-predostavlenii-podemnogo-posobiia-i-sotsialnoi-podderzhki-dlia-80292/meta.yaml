act_code: '80292'
requisite: Решение Сарканского районного маслихата Алматинской области от 5 мая 2014 года № 35-186. Зарегистрировано Департаментом юстиции Алматинской области 21 мая 2014 года № 2728. Утратило силу решением Сарканского районного маслихата Алмаинской области от 12 февраля 2015 года № 50-257
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, бразования, социального обеспечения, культуры, спорта и агропромышленного комплекса,  прибывшим для работы и проживания в сельские населенные пункты Сарканского района
  kaz: Сарқан ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
