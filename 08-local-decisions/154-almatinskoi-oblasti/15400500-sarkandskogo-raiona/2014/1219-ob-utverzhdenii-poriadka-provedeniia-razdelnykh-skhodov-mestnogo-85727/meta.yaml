act_code: '85727'
requisite: Решение Сарканского районного маслихата Алматинской области от 19 декабря 2014 года № 47-233. Зарегистрировано Департаментом юстиции Алматинской области 05 января 2015 года № 2992. Утратило силу решением Сарканского районного маслихата области Жетісу от 4 октября 2023 года № 12-52
title:
  rus: Об утверждении порядка  проведения раздельных сходов  местного сообщества и определения количества представителей жителей  села, улицы, многоквартирного жилого  дома для участия в сходе местного  сообщества в Сарканском районе
  kaz: Сарқан ауданында бөлек жергілікті қоғамдастық жиындарын өткізу  және жергілікті қоғамдастық  жиынына қатысу үшін ауыл, көше,  көппәтерлі тұрғын үй тұрғындары  өкілдерінің санын айқындау  тәртібін бекіту туралы
