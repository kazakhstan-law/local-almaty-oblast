requisite: Решение Саркандского районного маслихата Алматинской области от 12 февраля 2015 года № 50-257. Зарегистрировано Департаментом юстиции Алматинской области от 5 марта 2015 года № 3087. Утратило силу решением Сарканского районного маслихата области Жетісу от 25 апреля 2023 года № 4-21
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и  агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сарканского района
  kaz: Сарқан ауданының ауылдық  елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
