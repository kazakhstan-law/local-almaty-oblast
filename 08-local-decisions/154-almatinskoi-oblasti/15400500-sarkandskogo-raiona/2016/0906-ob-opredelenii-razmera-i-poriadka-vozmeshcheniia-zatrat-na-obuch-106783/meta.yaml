requisite: Решение Сарканского районного маслихата Алматинской области от 6 сентября 2016 года № 9-44. Зарегистрировано Департаментом юстиции Алматинской области 29 сентября 2016 года № 3974. Утратило силу решением Сарканского районного маслихата области Жетісу от 13 ноября 2023 года № 13-55
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Сарканском районе
  kaz: Сарқан ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
