act_code: '143653'
requisite: Решение Сарканского районного маслихата Алматинской области от 28 мая 2020 года № 81-317. Зарегистрировано Департаментом юстиции Алматинской области 8 июня 2020 года № 5535. Утратило силу решением Сарканского районного маслихата Алматинской области от 16 сентября 2020 года № 86-335
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов  Сарканского района
  kaz: Сарқан ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
