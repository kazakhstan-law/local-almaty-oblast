requisite: Решение Сарканского районного маслихата Алматинской области от 16 сентября 2020 года № 86-335. Зарегистрировано Департаментом юстиции Алматинской области 23 сентября 2020 года № 5666. Утратило силу решением Сарканского районного маслихата области Жетісу от 25 апреля 2023 года № 4-20
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов
  kaz: Азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
