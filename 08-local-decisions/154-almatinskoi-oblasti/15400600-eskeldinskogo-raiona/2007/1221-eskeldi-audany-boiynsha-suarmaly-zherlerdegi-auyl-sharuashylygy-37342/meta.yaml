requisite: Алматы облысы Ескелді аудандық мәслихатының 2007 жылғы 21 желтоқсандағы № 7-42 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының әділет басқармасында 2008 жылы 28 қаңтарда № 2-9-47 тіркелді
