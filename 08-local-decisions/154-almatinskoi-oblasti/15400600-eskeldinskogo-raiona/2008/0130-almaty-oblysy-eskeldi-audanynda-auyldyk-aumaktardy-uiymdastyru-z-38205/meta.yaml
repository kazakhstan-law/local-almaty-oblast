requisite: Алматы облысы Ескелді аудандық мәслихатының 2008 жылы 30 қаңтардағы № 9-55 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 6 наурызда № 2-9-54 тіркелді
