act_code: '40900'
requisite: Алматы облысы Ескелді ауданы Қайнарлы ауылдық округі әкімінің 2008 жылғы 30 маусымдағы № 8 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 28 шілдеде № 2-9-62 тіркелді
