act_code: '41085'
requisite: Алматы облысы Ескелді ауданы Қаратал ауылдық округі әкімінің 2008 жылғы 30 маусымдағы № 39 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 8 тамызда № 2-9-67 тіркелді
