act_code: '41084'
requisite: Алматы облысы Ескелді ауданы Төленгіт ауылдық округі әкімінің 2008 жылғы 30 маусымдағы № 29 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 8 тамызда № 2-9-66 тіркелді
