requisite: Алматы облысы Ескелді ауданы әкімінің 2008 жылғы 30 желтоқсандағы № 10 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2009 жылғы 29 қаңтарда № 2-9-74 тіркелді. Күші жойылды - Алматы облысы Ескелді ауданы әкімінің 2009 жылғы 30 сәуірдегі № 5 шешімімен
