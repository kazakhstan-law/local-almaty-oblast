requisite: Алматы облысы Ескелді аудандық мәслихатының 2009 жылғы 27 қаңтардағы № 19-114 шешімі. Алматы облысы Әділет департаменті Ескелді ауданының әділет басқармасында 2009 жылы 27 ақпанда № 2-9-75 тіркелді. Күші жойылды - Алматы облысы Ескелді аудандық мәслихатының 2009 жылғы 15 сәуірдегі № 23-151 шешімімен
