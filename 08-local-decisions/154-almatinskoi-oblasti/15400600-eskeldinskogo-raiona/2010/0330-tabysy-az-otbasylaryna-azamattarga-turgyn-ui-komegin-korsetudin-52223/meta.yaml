requisite: Алматы облысы Ескелді аудандық мәслихатының 2010 жылғы 30 наурыздағы № 37-224 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының әділет басқармасында 2010 жылы 28 сәуірде № 2-9-104 тіркелді. Күші жойылды - Алматы облысы Ескелді аудандық мәслихатының 2012 жылғы 21 мамырдағы № 6-36 шешімімен
