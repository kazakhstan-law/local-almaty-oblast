requisite: Алматы облысы Ескелді аудандық мәслихатының 2010 жылғы 20 шілдедегі № 41-253 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 13 тамызда № 2-9-111 тіркелді. Күші жойылды - Алматы облысы Ескелді аудандық мәслихатының 2011 жылғы 21 ақпандағы № 50-303 шешімімен
title:
