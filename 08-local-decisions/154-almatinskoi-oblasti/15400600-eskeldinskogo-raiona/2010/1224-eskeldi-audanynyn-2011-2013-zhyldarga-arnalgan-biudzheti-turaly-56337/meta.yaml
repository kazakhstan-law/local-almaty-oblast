requisite: Алматы облысы Ескелді аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 48-284 шешімі. Алматы облысы Ескелді ауданының Әділет басқармасында 2010 жылы 30 желтоқсанда № 2-9-117 тіркелді. Күші жойылды - Алматы облысы Ескелді аудандық мәслихатының 2012 жылғы 21 мамырдағы № 6-35 шешімімен
