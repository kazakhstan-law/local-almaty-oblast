  title:
    rus: О внесении изменений в решение Ескельдинского районного маслихата от 17 апреля 2012 года N 5-27 "Об установлении повышенных тарифных ставок в размере двадцати пяти процентов специалистам здравоохранения, социального обеспечения, образования, культуры и спорта работающим в сельских населенных пунктах Ескельдинского района"
    kaz: Ескелді ауданы мәслихатының 2012 жылғы 17 сәуірдегі N 5-27 "Ескелді ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент мөлшерінде жоғарылатылған тарифтік ставкалар белгілеу туралы" шешіміне өзгерістер енгізу туралы
