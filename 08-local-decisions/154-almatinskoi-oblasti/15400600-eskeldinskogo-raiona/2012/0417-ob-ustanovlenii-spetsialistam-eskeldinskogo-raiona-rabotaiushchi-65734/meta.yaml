act_code: '65734'
requisite: Решение маслихата Ескельдинского района Алматинской области от 17 апреля 2012 года № 5-27. Зарегистрировано Управлением юстиции Ескельдинского района Департамента юстиции Алматинской области 22 мая 2012 года № 2-9-137. Утратило силу решением Ескельдинского районного маслихата Алматинской области от 12 декабря 2014 года № 46-250
title:
  rus: Об установлении специалистам Ескельдинского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Ескелді ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
