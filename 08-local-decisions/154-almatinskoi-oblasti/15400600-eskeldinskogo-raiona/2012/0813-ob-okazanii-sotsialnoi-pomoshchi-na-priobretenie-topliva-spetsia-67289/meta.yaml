requisite: Решение маслихата Ескельдинского района Алматинской области от 13 августа 2012 года № 10-54. Зарегистрировано Управлением юстиции Ескельдинского района Департамента юстиции Алматинской области 24 августа 2012 года № 2-9-141. Утратило силу решением Ескельдинского районного маслихата Алматинской области от 26 апреля 2013 года № 18-107
title:
  rus: Об оказании социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии на 2012 год
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру мәдениет, спорт және ветеринария мамандарына отын сатып алу үшін 2012 жылы әлеуметтік  көмек беру туралы
