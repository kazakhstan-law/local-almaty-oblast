act_code: '73731'
requisite: Решение маслихата Ескельдинского района Алматинской области от 04 июля 2013 года № 21-121. Зарегистрировано Департаментом юстиции Алматинской области 29 июля 2013 года № 2416. Утратило силу решением Ескельдинского районного маслихата Алматинской области от 06 мая 2014 года № 37-204
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Ескельдинского района на 2013 год
  kaz: Ескелді ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін 2013 жылға әлеуметтік көмек беру туралы
