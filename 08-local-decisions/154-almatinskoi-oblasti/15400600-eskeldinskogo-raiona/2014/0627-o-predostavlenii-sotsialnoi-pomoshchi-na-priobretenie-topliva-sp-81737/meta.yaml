act_code: '81737'
requisite: Решение Ескельдинского районного маслихата Алматинской области от 27 июня 2014 года № 38-210. Зарегистрировано Департаментом юстиции Алматинской области 31 июля 2014 года № 2791. Утратило силу решением Ескельдинского районного маслихата Алматинской области от 15 октября 2014 года № 42-232
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Ескельдинского района
  kaz: Ескелді ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
