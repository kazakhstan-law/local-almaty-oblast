act_code: '81940'
requisite: Решение Ескельдинского районного маслихата Алматинской обласьти от 27 июня 2014 года № 38-211. Зарегистрировано Департаментом юстиции Алматинской области 08 августа 2014 года № 2800. Утратило силу решением Ескельдинского районного маслихата области Жетісу от 22 ноября 2023 года № 15-49
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Ескельдинском районе
  kaz: Ескелді ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
