act_code: '98427'
requisite: Решение Ескельдинского районного маслихата Алматинской области от 09 декабря 2015 года № 59-334
title:
  rus: О признании утратившим силу решения Ескельдинского районного маслихата № 44-240 от 19 ноября 2014 года «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Ескельдинского района»
  kaz: Ескелді аудандық мәслихатының 2014 жылғы 19 қарашадағы «Ескелді ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» № 44-240 шешімінің күші жойылды деп танылсын
