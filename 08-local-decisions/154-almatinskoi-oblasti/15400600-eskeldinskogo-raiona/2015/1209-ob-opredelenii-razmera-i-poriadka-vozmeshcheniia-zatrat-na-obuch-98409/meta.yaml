requisite: Решение Ескельдинского районного маслихата Алматинской области от 09 декабря 2015 года № 59-325. Зарегистрировано Департаментом юстиции Алматинской области 13 января 2016 года № 3674. Утратило силу решением Ескельдинского районного маслихата Алматинской области от 27 декабря 2021 года № 21-73
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Ескельдинском районе
  kaz: Ескелді ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
