    kaz: Ескелді аудандық мәслихатының 2018 жылғы 30 қаңтардағы «Ескелді ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 25-165 шешіміне өзгерістер енгізу туралы
