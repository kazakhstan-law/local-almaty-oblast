requisite: Решение Ескельдинского районного маслихата Алматинской области от 7 октября 2020 года № 72-403. Зарегистрировано Департаментом юстиции Алматинской области 19 октября 2020 года № 5714
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах Ескельдинского района
  kaz: Ескелді ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
