act_code: '41155'
requisite: Алматы облысы Ескелді ауданы Қарабұлақ кенттік округі әкімінің 2008 жылғы 30 маусымдағы № 324 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2008 жылы 8 тамызда № 2-9-68 тіркелді
