requisite: Алматы облысы Ескелді ауданы Қарабұлақ кенттік округі әкімінің 2010 жылғы 12 мамырдағы № 119 шешімі. Алматы облысының Әділет департаменті Ескелді ауданының Әділет басқармасында 2010 жылы 18 маусымда № 2-9-108 тіркелді
