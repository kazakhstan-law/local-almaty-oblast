requisite: Алматы облысы Көксу аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № 19-1 шешімі. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2009 жылғы 9 қаңтарда № 2-14-68 тіркелді. Күші жойылды - Алматы облысы Көксу аудандық мәслихатының 2010 жылғы 04 ақпандағы № 35-4 шешімімен
