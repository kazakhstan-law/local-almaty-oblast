requisite: Алматы облысы Көксу аудандық мәслихатының 2009 жылғы 10 маусымдағы № 26-1 шешімі. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2009 жылы 14 шілдеде № 2-14-77 тіркелді. Күші жойылды - Алматы облысы Көксу аудандық мәслихатының 2011 жылғы 28 наурыздағы № 54-3 шешімімен
