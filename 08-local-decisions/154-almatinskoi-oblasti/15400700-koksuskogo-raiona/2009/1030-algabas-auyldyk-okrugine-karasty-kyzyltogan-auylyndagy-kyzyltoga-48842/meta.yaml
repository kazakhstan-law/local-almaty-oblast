act_code: '48842'
requisite: Алматы облысы Көксу ауданы Алғабас ауылдық округі әкімінің 2009 жылғы 30 қазандағы № 10-10 шешімі. Алматы облысының Әділет департаменті Көксу ауданының әділет басқармасында 2009 жылы 24 қарашада № 2-14-81 тіркелді
