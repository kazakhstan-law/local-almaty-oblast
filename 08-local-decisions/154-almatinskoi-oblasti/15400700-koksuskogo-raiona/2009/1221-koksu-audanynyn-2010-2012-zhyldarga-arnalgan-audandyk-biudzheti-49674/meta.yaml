requisite: Алматы облысы Көксу аудандық мәслихатының 2009 жылғы 21 желтоқсандағы N 34-1 шешімі. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2010 жылы 05 қаңтарда N 2-14-85 тіркелді. Күші жойылды - Алматы облысы Көксу аудандық мәслихатының 2011 жылғы 24 қаңтардағы N 49-5 шешімімен
