requisite: Алматы облысы Көксу аудандық мәслихатының 2010 жылғы 29 шілдедегі № 42-4 шешімі. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2010 жылы 13 тамызда № 2-14-96 тіркелді. Күші жойылды - Алматы облысы Көксу аудандық мәслихатының 2011 жылғы 24 қаңтардағы № 49-5 шешімімен
title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына отын сатып алу үшін 2010 жылы әлеуметтік көмек беру туралы
