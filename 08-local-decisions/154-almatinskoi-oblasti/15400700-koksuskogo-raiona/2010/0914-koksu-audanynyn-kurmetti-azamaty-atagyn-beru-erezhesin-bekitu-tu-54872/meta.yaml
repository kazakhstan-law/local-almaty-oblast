requisite: Алматы облысы Көксу аудандық мәслихатының 2010 жылғы 14 қыркүйектегі № 44-2 шешімі. Алматы облысының Әділет департаменті Көксу ауданының Әділет басқармасында 2010 жылы 12 қазанда № 2-14-99 тіркелді. Күші жойылды - Алматы облысы Көксу аудандық мәслихатының 2012 жылғы 08 маусымдағы № 4-9 шешімімен
