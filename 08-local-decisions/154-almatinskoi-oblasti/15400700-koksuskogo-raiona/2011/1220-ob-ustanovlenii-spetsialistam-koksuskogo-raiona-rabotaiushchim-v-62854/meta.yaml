act_code: '62854'
requisite: Решение маслихата Коксуского района Алматинской области от 20 декабря 2011 года N 66-3. Зарегистрировано Управлением юстиции Коксуского района Департамента юстиции Алматинской области 13 января 2012 года N 2-14-121. Утратило силу решением Коксуского районного маслихата Алматинской области от 06 мая 2015 года N 41-2
title:
  rus: Об установлении специалистам, Коксуского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта ежемесячной  надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Көксу ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
