requisite: Решение маслихата Коксуского района Алматинской области от 25 июля 2012 года № 5-6. Зарегистрировано Управлением юстиции Коксуского района Департамента юстиции Алматинской области 16 августа 2012 года № 2-14-134. Утратило силу решением маслихата Коксуского района Алматинской области от 19 августа 2013 года № 20-2
title:
  rus: О социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах в 2012 году
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және  ветеринария ұйымдарының мамандарына отын сатып алу үшін 2012 жылы әлеуметтік көмек беру туралы
