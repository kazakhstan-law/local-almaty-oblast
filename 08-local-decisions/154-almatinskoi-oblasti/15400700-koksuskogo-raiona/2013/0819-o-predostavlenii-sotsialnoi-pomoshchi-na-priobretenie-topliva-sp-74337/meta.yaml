requisite: Решение маслихата Коксуского района Алматинской области от 19 августа 2013 года № 20-2. Зарегистрировано Департаментом юстиции Алматинской области 06 сентября 2013 года № 2448. Утратило силу решением Коксуского районного маслихата Алматинской области от 11 апреля 2014 года № 28-11
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах в 2013 году
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін 2013 жылы әлеуметтік көмек беру туралы
