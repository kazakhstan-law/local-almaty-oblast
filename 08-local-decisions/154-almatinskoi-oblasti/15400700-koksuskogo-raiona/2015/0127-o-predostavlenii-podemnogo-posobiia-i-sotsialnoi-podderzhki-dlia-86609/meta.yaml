act_code: '86609'
requisite: Решение Коксуского районного маслихата Алматинской области от 27 января 2015 года № 39-1. Зарегистрировано Департаментом юстиции Алматинской области 04 февраля 2015 года № 3017. Утратило силу решением Коксуского районного маслихата Алматинской области от 1 сентября 2021 года № 11-3
title:
  rus: О предоставлении подъемного  пособия и социальной поддержки  для приобретения или строительства  жилья специалистам в области  здравоохранения, образования,  социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты Коксуского района
  kaz: Көксу ауданының ауылдық елді  мекендерге жұмыс істеуге және тұруға  келген денсаулық сақтау, білім беру,  әлеуметтік қамсыздандыру, мәдениет,  спорт және агроөнеркәсіптік кешен  саласындағы мамандарға көтерме  жәрдемақы және тұрғын үй алу немесе  салу үшін әлеуметтік қолдау көрсету туралы
