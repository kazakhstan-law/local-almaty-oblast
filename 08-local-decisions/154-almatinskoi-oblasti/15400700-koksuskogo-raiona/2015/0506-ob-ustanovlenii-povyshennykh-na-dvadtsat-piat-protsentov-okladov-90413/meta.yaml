act_code: '90413'
requisite: Решение Коксуского районного маслихата Алматинской области от 6 мая 2015 года № 41-2. Зарегистрировано Департаментом юстиции Алматинской области 4 июня 2015 года № 3188. Утратило силу решением Коксуского районного маслихата Алматинской области от 4 декабря 2019 года № 55-2
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Коксуского района
  kaz: Көксу ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет,  спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
