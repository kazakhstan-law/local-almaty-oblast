act_code: '136917'
requisite: Решение Коксуского районного маслихата Алматинской области от 4 декабря 2019 года № 55-2. Зарегистрировано Департаментом юстиции Алматинской области 10 декабря 2019 года № 5320. Утратило силу решением Коксуского районного маслихата Алматинской области от 23 сентября 2020 года № 66-2
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Коксуского района
  kaz: Көксу ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
