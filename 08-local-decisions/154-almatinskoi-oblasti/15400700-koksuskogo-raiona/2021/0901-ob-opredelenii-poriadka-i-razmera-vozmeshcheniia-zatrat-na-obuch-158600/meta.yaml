requisite: Решение Коксуского районного маслихата Алматинской области от 1 сентября 2021 года № 11-2. Зарегистрировано в Министерстве юстиции Республики Казахстан 14 сентября 2021 года № 24332. Утратило силу решением Коксуского районного маслихата области Жетісу от 20 октября 2023 года № 12-52
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Коксуском районе
  kaz: Көксу ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы
