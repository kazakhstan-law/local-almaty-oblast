act_code: '159236'
requisite: Решение маслихата Коксуского района Алматинской области от 29 сентября 2021 года № 13-2. Утратило силу решением Коксуского районного маслихата области Жетісу от 25 сентября 2025 года № 47-185 (вводится в действие по истечение десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении подъемное пособие и социальную поддержку для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Коксуского района
  kaz: Көксу ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға,  ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу  немесе салу үшін әлеуметтік қолдау көрсету туралы
