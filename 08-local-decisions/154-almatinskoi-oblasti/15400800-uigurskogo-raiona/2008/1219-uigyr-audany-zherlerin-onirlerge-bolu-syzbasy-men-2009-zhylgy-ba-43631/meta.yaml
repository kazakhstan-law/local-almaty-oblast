requisite: Алматы облысы Ұйғыр аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 17-5 шешімі. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2009 жылғы 20 қаңтарда № 2-19-68 тіркелді. Күші жойылды - Алматы облысы Ұйғыр аудандық мәслихатының 2009 жылғы 26 наурыздағы № 21-6 шешімімен
