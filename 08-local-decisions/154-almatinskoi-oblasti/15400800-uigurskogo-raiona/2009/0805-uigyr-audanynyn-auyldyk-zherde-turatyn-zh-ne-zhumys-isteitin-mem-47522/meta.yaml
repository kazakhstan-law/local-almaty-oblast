requisite: Алматы облысы Ұйғыр аудандық мәслихатының 2009 жылғы 5 тамыздағы N 25-3 шешімі. Алматы облысының әділет департаменті Ұйғыр ауданының әділет басқармасында 2009 жылы 27 тамызда N 2-19-82 тіркелді. Күші жойылды - Алматы облысы Ұйғыр аудандық мәслихатының 2010 жылғы 05 ақпандағы N 31-6 шешімімен
title:
  rus: Ұйғыр ауданының ауылдық жерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт ұйымдарының қызметкерлеріне отын сатып алу үшін біржолғы әлеуметтік көмек беру туралы
