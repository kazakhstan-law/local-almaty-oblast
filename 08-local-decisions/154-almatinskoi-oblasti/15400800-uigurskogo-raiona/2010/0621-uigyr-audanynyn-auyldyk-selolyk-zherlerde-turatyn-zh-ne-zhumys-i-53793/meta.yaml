requisite: Алматы облысы Ұйғыр аудандық мәслихатының 2010 жылғы 22 маусымдағы № 35-2 шешімі. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2010 жылы 30 шілдеде № 2-19-103 тіркелді. Күші жойылды - Алматы облысы Ұйғыр аудандық мәслихатының 2010 жылғы 22 желтоқсандағы № 43-7 шешімімен
