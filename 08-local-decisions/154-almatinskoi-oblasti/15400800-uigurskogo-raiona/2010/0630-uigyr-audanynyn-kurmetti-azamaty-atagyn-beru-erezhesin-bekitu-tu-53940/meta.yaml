requisite: Алматы облысы Ұйғыр аудандық мәслихатының 2010 жылғы 30 маусымдағы № 36-6 шешімі. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2010 жылы 06 тамызда № 2-19-105 тіркелді. Күші жойылды - Алматы облысы Ұйғыр аудандық мәслихатының 2012 жылғы 08 маусымдағы № 5-2 шешімімен
