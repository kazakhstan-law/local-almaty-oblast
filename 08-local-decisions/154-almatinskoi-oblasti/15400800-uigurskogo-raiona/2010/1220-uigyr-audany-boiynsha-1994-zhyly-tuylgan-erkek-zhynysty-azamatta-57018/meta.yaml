requisite: Алматы облысы Ұйғыр ауданы әкімінің 2010 жылғы 20 желтоқсандағы № 12-07 шешімі. Алматы облысының Әділет департаменті Ұйғыр ауданының Әділет басқармасында 2011 жылы 21 қаңтарда № 2-19-112 тіркелді. Күші жойылды - Алматы облысы Ұйғыр ауданы әкімінің 2011 жылғы 23 мамырдағы № 05-07 Шешімімен
