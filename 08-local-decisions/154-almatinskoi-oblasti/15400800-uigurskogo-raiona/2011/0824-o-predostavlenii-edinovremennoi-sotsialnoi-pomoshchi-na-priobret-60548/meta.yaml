requisite: Решение маслихата Уйгурского района Алматинской области от 24 августа 2011 года № 51-2. Зарегистрировано Управлением юстиции Уйгурского района Департамента юстиции Алматинской области 22 сентября 2011 года № 2-19-119. Утратило силу решением Уйгурского районного маслихата Алматинской области от 5 июня 2020 года № 6-65-373
title:
  rus: О предоставлении единовременной социальной помощи на приобретение топлива специалистам государственных организаций сферы здравоохранения, социального обеспечения, образования, культуры и спорта, работающим и проживающим в сельской местности по Уйгурскому району
  kaz: Ұйғыр ауданының ауылдық (селолық) жерлерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының қызметкерлеріне отын сатып алу үшін бюджет қаражат есебінен біржолғы әлеуметтік көмек беру туралы
