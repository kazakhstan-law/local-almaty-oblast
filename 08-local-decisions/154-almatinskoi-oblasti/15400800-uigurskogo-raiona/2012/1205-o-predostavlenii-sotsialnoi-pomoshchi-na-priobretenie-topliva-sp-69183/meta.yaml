act_code: '69183'
requisite: Решение маслихата Уйгурского района Алматинской области от 05 декабря 2012 года № 12-4. Зарегистрировано Департаментом юстиции Алматинской области 13 декабря 2012 года № 2244. Утратило силу решением Уйгурского районного маслихата Алматинской области от 03 ноября 2014 года № 39-1
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения,  образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Уйгурского района
  kaz: Ұйғыр ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру,  мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
