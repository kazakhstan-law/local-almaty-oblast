act_code: '77978'
requisite: Решение маслихата Уйгурского района Алматинской области от 10 февраля 2014 года N 28-2. Зарегистрировано Департаментом юстиции Алматинской области 12 марта 2014 года N 2608. Утратило силу решением Уйгурского районного маслихата Алматинской области от 05 августа 2014 года № 36-5
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Уйгурского района
  kaz: Ұйғыр ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
