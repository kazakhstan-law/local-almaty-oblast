requisite: Решение маслихата Уйгурского района Алматинской области от 28 февраля 2014 года N 29-2. Зарегистрировано Департаментом юстиции Алматинской области 09 апреля 2014 года N 2646. Утратило силу решением Уйгурского районного маслихата Алматинской области от 5 февраля 2024 года № 8-17-88
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Уйгурском районе
  kaz: Ұйғыр ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
