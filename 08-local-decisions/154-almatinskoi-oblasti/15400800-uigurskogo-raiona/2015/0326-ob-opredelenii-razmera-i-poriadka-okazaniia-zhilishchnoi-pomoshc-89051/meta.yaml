  title:
    rus: О внесении изменений в решение Уйгурского районного маслихата от 26 марта 2015 года № 45-4 «Об определении размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) Уйгурского района»
    kaz: Ұйғыр аудандық мәслихатының 2015 жылғы 26 наурыздағы «Ұйғыр ауданындағы аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау туралы» № 45-4 шешіміне өзгерістер енгізу туралы»
