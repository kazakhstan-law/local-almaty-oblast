requisite: Алматы облысы Қаратал аудандық мәслихатының 2007 жылғы 17 сәуірдегі № 50-223 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2007 жылы 15 мамырда № 2-12-51 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2011 жылғы 29 желтоқсандағы № 61-268 шешімімен
