requisite: Алматы облысы Қаратал аудандық мәслихатының 2007 жылғы 2 тамыздағы № 54-239 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2007 жылы 16 тамызда № 2-12-56 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2007 жылдың 24 желтоқсандағы № 3-21 шешімімен
title:
