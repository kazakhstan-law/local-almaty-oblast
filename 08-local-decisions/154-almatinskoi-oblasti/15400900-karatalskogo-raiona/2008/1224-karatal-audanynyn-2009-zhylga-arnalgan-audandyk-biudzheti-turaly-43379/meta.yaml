requisite: Алматы облысы Қаратал аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 16-71 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының әділет басқармасында 2009 жылғы 8 қаңтарда № 2-12-97 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2010 жылғы 30 наурыздағы № 35-163 шешімімен
