requisite: Алматы облысы Қаратал ауданы әкімінің 2008 жылғы 26 желтоқсандағы № 12-13 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2009 жылғы 29 қаңтарда № 2-12-99 тіркелді. Күші жойлды - Алматы облысы Қаратал ауданы әкімінің 2009 жылғы 12 маусымдағы № 6-13 шешімімен
