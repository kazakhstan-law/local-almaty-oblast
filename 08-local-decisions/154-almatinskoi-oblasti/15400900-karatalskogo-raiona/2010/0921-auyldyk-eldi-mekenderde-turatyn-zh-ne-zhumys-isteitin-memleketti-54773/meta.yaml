requisite: Алматы облысы Қаратал аудандық мәслихатының 2010 жылғы 21 қыркүйектегі № 39-189 шешімі. Алматы облысының әділет департаменті Қаратал ауданының әділет басқармасында 2010 жылы 05 қазанда № 2-12-160 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2011 жылғы 10 қарашадағы № 57-260 шешімімен
title:
  rus: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін 2010 жылы әлеуметтік көмек беру туралы
