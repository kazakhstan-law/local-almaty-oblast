requisite: Алматы облысы Қаратал ауданы әкімінің 2010 жылғы 22 желтоқсандағы № 12-03 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2011 жылы 18 қаңтарда № 2-12-167 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық әкімінің 2011 жылғы 27 желтоқсандағы № 12-12 шешімімен
