requisite: Алматы облысы Қаратал аудандық мәслихатының 2010 жылғы 22 желтоқсандағы № 42-206 шешімі. Алматы облысының Әділет департаменті Қаратал ауданының Әділет басқармасында 2010 жылы 30 желтоқсанда № 2-12-166 тіркелді. Күші жойылды - Алматы облысы Қаратал аудандық мәслихатының 2012 жылғы 11 сәуірдегі № 4-32 шешімімен
