requisite: Решение маслихата Каратальского района Алматинской области от 10 ноября 2011 года № 57-260. Зарегистрировано Управлением юстиции Каратальского района Департамента юстиции Алматинской области 24 ноября 2011 года № 2-12-182. Утратило силу - Решением маслихата Каратальского района Алматинской области от 17 октября 2012 года № 12-52
title:
  rus: Об оказании в 2011 году социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельской местности на территории Каратальского района
  kaz: Қаратал ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін 2011 жылы әлеуметтік көмек беру туралы
