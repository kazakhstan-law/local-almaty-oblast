act_code: '66072'
requisite: Решение маслихата Каратальского района Алматинской области от 16 мая 2012 года № 5-33. Зарегистрировано Управлением юстиции Каратальского района Департамента юстиции Алматинской области 11 июня 2012 года № 2-12-194. Утратило силу решением Каратальского районного маслихата Алматинской области от 24 апреля 2015 года № 45-184
title:
  rus: Об установлении специалистам, Каратальского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Қаратал ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
