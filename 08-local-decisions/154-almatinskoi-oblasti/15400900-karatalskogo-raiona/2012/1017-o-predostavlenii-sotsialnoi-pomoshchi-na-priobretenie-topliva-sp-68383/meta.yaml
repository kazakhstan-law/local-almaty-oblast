requisite: Решение маслихата Каратальского района Алматинской области от 17 октября 2012 года № 12-52. Зарегистрировано Департаментом юстиции Алматинской области 07 ноября 2012 года № 2162. Утратило силу решением маслихата Каратальского района Алматинской области от 24 сентября 2013 года № 22-96
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельской местности на 2012 год
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін 2012 жылы әлеуметтік көмек беру туралы
