requisite: Решение маслихата Каратальского района Алматинской области от 24 сентября 2013 года № 22-96. Зарегистрировано Департаментом юстиции Алматинской области 18 октября 2013 года № 2456. Утратило силу решением Каратальского районного маслихата Алматинской области от 05 августа 2014 года № 34-140
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельской местности на 2013 год
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін 2013 жылға әлеуметтік көмек беру туралы
