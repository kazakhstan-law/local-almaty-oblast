act_code: '79093'
requisite: Решение маслихата Каратальского района Алматинской области от 19 марта 2014 года N 28-121. Зарегистрировано Департаментом юстиции Алматинской области 16 апреля 2014 года N 2671. Утратило силу решением Каратальского районного маслихата области Жетісу от 8 ноября 2023 года № 12-44
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества  и определения количество представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Каратальском районе
  kaz: Қаратал ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және  жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
