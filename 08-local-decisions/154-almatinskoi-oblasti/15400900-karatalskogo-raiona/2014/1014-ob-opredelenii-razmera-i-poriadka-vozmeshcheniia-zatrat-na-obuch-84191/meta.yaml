requisite: Решение Каратальского районного маслихата Алматинской области от 14 октября 2014 года № 36-153. Зарегистрировано Департаментом юстиции Алматинской области 05 ноября 2014 года № 2907. Утратило силу решением Каратальского районного маслихата Алматинской области от 03 февраля 2016 года № 57-238
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Каратальском районе
  kaz: Қаратал ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
