act_code: '90723'
requisite: Решение Каратальского районного маслихата Алматинской области от 26 мая 2015 года № 46-186. Зарегистрировано Департаментом юстиции Алматинской области 18 июня 2015 года № 3235. Утратило силу решением Каратальского районного маслихата Алматинской области от 7 апреля 2020 года № 69-246
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каратальского района
  kaz: Қаратал ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
