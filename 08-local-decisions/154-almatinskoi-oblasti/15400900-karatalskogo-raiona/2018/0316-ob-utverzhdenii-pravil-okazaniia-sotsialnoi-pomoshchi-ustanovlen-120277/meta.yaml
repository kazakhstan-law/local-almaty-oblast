    kaz: Қаратал аудандық мәслихатының 2018 жылғы 16 наурыздағы «Қаратал ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 31-134 шешіміне өзгерістер енгізу туралы
