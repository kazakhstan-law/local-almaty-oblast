  title:
    rus: О внесении изменений в решение Каратальского районного маслихата от 5 октября 2020 года № 77-271 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каратальского района»
    kaz: Қаратал аудандық мәслихатының 2020 жылғы 5 қазандағы № 77-271 «Қаратал ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
