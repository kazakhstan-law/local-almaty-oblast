act_code: '147389'
requisite: Решение Каратальского районного маслихата Алматинской области от 5 октября 2020 года № 77-271. Зарегистрировано Департаментом юстиции Алматинской области 13 октября 2020 года № 5708. Утратило силу решением Каратальского районного маслихата области Жетісу от 26 мая 2025 года № 43-124 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельских населенных пунктах Каратальского района
  kaz: Қаратал ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
