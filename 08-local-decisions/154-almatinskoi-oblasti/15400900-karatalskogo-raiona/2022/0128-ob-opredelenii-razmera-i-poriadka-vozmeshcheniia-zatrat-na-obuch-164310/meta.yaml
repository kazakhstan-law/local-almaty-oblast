requisite: Решение Каратальского районного маслихата Алматинской области от 28 января 2022 года № 23-62. Зарегистрировано в Министерстве юстиции Республики Казахстан 4 февраля 2022 года № 26741. Утратило силу решением Каратальского районного маслихата области Жетісу от 22 ноября 2023 года № 14-47
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Каратальском районе
