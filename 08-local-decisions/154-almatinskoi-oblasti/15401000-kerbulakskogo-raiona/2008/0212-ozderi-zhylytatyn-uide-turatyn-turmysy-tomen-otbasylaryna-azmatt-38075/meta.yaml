requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2008 жылғы 12 ақпандағы № 05-45 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2008 жылы 28 ақпанда № 2-13-66 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2010 жылғы 25 сәуірдегі № 28-214 шешімімен
