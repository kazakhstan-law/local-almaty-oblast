requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2008 жылғы 25 шілдедегі № 09-79 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2008 жылы 2 қыркүйекте № 2-13-77 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2009 жылғы 15 сәуірдегі № 20-136 шешімімен
title:
  rus: Кербұлақ ауданының ауылдық /селолық/ жерлерде тұратын және жұмыс істейтін мемлекеттік білім беру ұйымдарының педагог қызметкерлеріне, денсаулық сақтау саласындағы қызметкерлерге және әлеуметтік қамсыздандыру ұйымдарының мамандарына әлеуметтік көмек беру туралы
  kaz: Кербұлақ ауданының ауылдық /селолық/ жерлерде тұратын және жұмыс істейтін мемлекеттік білім беру ұйымдарының педагог қызметкерлеріне, денсаулық сақтау саласындағы қызметкерлерге және әлеуметтік қамсыздандыру ұйымдарының мамандарына әлеуметтік көмек беру туралы
