requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2008 жылғы 16 қазандағы № 12-94 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының әділет басқармасында 2008 жылы 24 қарашада № 2-13-81 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 26-185 шешімімен
