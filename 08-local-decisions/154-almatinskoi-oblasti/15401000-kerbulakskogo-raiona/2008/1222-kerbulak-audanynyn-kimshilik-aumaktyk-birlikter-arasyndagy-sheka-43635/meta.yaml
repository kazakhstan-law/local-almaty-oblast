requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № 15-114 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2009 жылғы 19 қаңтарда № 2-13-84 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2009 жылғы 06 ақпандағы № 17-122 шешімімен
