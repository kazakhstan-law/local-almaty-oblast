requisite: Алматы облысы Кербұлақ ауданы әкімінің 2008 жылғы 25 желтоқсандағы № 39 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2009 жылғы 20 қаңтарда № 2-13-86 тіркелді. Күші жойылды - Алматы облысы Кербұлақ ауданы әкімінің 2009 жылғы 22 желтоқсандағы № 2 шешімімен
