requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2008 жылғы 29 желтоқсандағы № 15-117 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының әділет басқармасында 2009 жылы 19 қаңтарда № 2-13-85 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2010 жылғы 11 мамырдағы № 29-223 шешімімен
