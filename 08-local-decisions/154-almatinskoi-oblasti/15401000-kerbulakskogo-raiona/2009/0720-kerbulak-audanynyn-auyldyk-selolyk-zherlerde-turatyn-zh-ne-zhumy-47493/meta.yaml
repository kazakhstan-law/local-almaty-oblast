act_code: '47493'
requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2009 жылғы 20 шілдедегі N 22-157 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2009 жылы 19 тамызда N 2-13-99 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2009 жылғы 23 желтоқсандағы N 26-188 шешімімен
title:
  rus: Кербұлақ ауданының ауылдық (селолық) жерлерде тұратын және жұмыс істейтін мемлекеттік білім беру ұйымдарының педагог қызметкерлеріне, денсаулық сақтау саласындағы қызметкерлерге және әлеуметтік қамсыздандыру ұйымдарының мамандарына, отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
  kaz: Кербұлақ ауданының ауылдық (селолық) жерлерде тұратын және жұмыс істейтін мемлекеттік білім беру ұйымдарының педагог қызметкерлеріне, денсаулық сақтау саласындағы қызметкерлерге және әлеуметтік қамсыздандыру ұйымдарының мамандарына, отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
