requisite: Алматы облысы Кербұлақ ауданы әкімінің 2009 жылғы 22 желтоқсандағы № 2 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 28 қаңтарда № 2-13-103 тіркелді. Күші жойылды - Алматы облысы Кербұлақ ауданы әкімінің 2010 жылғы 14 желтоқсандағы № 8 шешімімен
