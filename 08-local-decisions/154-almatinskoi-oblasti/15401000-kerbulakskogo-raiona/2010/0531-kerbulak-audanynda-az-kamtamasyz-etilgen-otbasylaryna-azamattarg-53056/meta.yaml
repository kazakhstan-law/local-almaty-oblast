requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2010 жылғы 31 мамырдағы № 30-226 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 09 маусымда № 2-13-115 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2012 жылғы 31 тамыздағы № 08-51 шешімімен
