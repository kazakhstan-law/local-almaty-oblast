act_code: '54376'
requisite: Алматы облысы Кербұлақ ауданы Жайнақ батыр ауылдық округі әкімінің 2010 жылғы 02 тамыздағы № 9 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 06 қыркүйекте № 2-13-117 тіркелді
