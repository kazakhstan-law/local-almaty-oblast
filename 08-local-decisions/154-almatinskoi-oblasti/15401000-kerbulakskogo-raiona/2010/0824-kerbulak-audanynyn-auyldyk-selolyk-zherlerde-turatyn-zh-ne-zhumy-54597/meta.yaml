requisite: Алматы облысы Кербұлақ аудандық мәслихатының 2010 жылғы 24 тамыздағы № 32-241 шешімі. Алматы облысының Әділет департаменті Кербұлақ ауданының Әділет басқармасында 2010 жылы 21 қыркүйекте № 2-13-128 тіркелді. Күші жойылды - Алматы облысы Кербұлақ аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 36-282 шешімімен
title:
  rus: Кербұлақ ауданының ауылдық (селолық) жерлерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
