requisite: Решение маслихата Кербулакского района Алматинской области от 26 марта 2012 года № 04-23. Зарегистрировано Управлением юстиции Кербулакского района Департамента юстиции Алматинской области 25 апреля 2012 года № 2-13-157. Утратило силу решением маслихата Кербулакского района Алматинской области от 10 февраля 2014 года № 26-161
title:
  rus: О назначении социальной помощи на приобретение топлива специалистам государственных организации здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Кербулакского района
  kaz: Кербұлақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
