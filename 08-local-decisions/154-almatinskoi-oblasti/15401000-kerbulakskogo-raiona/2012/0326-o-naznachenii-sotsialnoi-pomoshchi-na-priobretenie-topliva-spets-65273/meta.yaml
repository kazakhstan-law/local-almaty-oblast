  title:
    rus: О внесении изменении в решение Кербулакского районного маслихата от 26 марта 2012 года N 04-23 "О назначении социальной помощи на приобретение топлива специалистам государственных организации здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Кербулакского района"
    kaz: Кербұлақ аудандық мәслихатының 2012 жылдың 26 наурыздағы N 04-23 "Кербұлақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы" шешіміне өзгерістер енгізу туралы
