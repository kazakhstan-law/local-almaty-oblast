  kaz: Кербұлақ ауданы бойынша ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес пайыз жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
