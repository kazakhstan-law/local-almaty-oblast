    kaz: Кербұлақ аудандық мәслихатының 2012 жылдың 26 наурыздағы N 04-22 "Кербұлақ ауданы бойынша ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандару, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлыққақы мен тарифтік ставкалар белгілеу туралы" шешіміне өзгерістер енгізу туралы
