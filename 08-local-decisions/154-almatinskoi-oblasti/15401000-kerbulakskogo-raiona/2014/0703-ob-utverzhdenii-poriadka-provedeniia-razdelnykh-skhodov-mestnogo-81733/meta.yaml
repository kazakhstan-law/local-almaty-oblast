act_code: '81733'
requisite: Решение Кербулакского районного маслихата Алматинской области от 03 июля 2014 года № 32-193. Зарегистрировано Департаментом юстиции Алматинской области 30 июля 2014 года № 2790. Утратило силу решением Кербулакского районного маслихата области Жетісу от 4 августа 2023 года № 06-45
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Кербулакском районе
  kaz: Кербұлақ ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
