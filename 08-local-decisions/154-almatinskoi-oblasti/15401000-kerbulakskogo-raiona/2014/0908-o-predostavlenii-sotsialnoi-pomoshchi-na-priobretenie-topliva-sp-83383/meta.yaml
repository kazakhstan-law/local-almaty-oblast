requisite: Решение Кербулакского районного маслихата Алматинской области от 8 сентября 2014 года № 34-202. Зарегистрировано Департаментом юстиции Алматинской области 16 сентября 2014 года № 2854. Утратило силу решением Кербулакского районного маслихата Алматинской области от 15 октября 2014 года № 36-215
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Кербұлақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
