    kaz: Кербұлақ аудандық мәслихатының 2018 жылғы 15 наурыздағы «Кербұлақ ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 28-153 шешіміне өзгерістер енгізу туралы
