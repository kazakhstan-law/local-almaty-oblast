  requisite: Решение Кербулакского районного маслихата Алматинской области от 27 сентября 2021 года № 12-60. Зарегистрировано в Министерстве юстиции Республики Казахстан 12 октября 2021 года № 24715. Утратило силу решением Кербулакского районного маслихата области Жетісу от 21 января 2026 года № 32-251 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение Кербулакского районного маслихата от 22 сентября 2020 года № 61-358 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта являющимся гражданскими служащими и работающим в сельских населенных пунктах Кербулакского района»
    kaz: Кербұлақ аудандық мәслихатының 2020 жылғы 22 қыркүйектегі «Кербұлақ ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» № 61-358 шешіміне өзгерістер енгізу туралы
