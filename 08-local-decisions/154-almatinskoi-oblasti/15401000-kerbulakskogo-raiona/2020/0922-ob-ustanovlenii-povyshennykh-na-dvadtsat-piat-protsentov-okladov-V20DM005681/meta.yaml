requisite: Решение Кербулакского районного маслихата Алматинской области от 22 сентября 2020 года № 61-358. Зарегистрировано Департаментом юстиции Алматинской области 29 сентября 2020 года № 5681. Утратило силу решением Кербулакского районного маслихата области Жетісу от 21 января 2026 года № 32-251 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры являющимся гражданскими служащими и работающим в сельских населенных пунктах Кербулакского района, финансируемых из местного бюджета
  kaz: Азаматтық қызметшілер болып табылатын және жергілікті бюджеттен қаржыландырылатын Кербұлақ ауданының ауылдық елдi мекендерінде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарына жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
