requisite: Алматы облысы Ақсу аудандық мәслихатының 2006 жылғы 20 желтоқсандағы № 41-224 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2007 жылы 5 қаңтарда № 2-4-39 тіркелген. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2008 жылғы 30 қаңтардағы № 5-31 шешімімен
