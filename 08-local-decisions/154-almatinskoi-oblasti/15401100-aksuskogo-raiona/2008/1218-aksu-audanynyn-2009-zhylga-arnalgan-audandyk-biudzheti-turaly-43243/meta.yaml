requisite: Алматы облысы Ақсу аудандық мәслихатының 2008 жылғы 18 желтоқсандағы № 17-97 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2009 жылы 6 қаңтарда № 2-4-82 тіркелді. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2010 жылғы 9 ақпандағы № 30-184 шешімімен
