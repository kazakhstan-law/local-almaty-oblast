requisite: Алматы облысы Ақсу ауданы әкімінің 2008 жылғы 24 желтоқсандағы № 3 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2009 жылғы 26 қаңтарда № 2-4-83 тіркелді. Күші жойылды - Алматы облысы Ақсу ауданы әкімінің 2009 жылғы 06 сәуірдегі № 2 шешімімен
