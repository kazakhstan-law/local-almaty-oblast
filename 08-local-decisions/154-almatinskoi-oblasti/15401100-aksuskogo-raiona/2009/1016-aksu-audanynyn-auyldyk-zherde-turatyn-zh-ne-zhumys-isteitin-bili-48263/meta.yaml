requisite: Алматы облысы Ақсу аудандық мәслихатының 2009 жылғы 16 қазандағы № 26-149 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2009 жылы 27 қазанда № 2-4-94 тіркелді. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2012 жылғы 05 қарашадағы № 8-67 шешімімен
title:
