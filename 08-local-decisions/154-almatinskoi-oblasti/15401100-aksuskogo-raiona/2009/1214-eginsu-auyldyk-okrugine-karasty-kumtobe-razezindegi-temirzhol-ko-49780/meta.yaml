act_code: '49780'
requisite: Алматы облысы Ақсу ауданы Егінсу ауылдық округі әкімінің 2009 жылғы 14 желтоқсандағы № 1 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының әділет басқармасында 2010 жылы 6 қаңтарда № 2-4-98 тіркелді
