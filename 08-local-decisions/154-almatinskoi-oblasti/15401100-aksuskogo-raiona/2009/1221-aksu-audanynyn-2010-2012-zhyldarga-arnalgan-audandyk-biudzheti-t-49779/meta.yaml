requisite: Алматы облысы Ақсу аудандық мәслихатының 2009 жылғы 21 желтоқсандағы № 29-167 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 10 қаңтарда № 2-4-97 тіркелді. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2011 жылғы 24 қаңтардағы № 41-260 шешімімен
