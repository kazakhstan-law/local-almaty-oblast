requisite: Алматы облысы Ақсу ауданы Ақсу ауылдық округі әкімінің 2010 жылғы 17 мамырдағы № 1 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 15 маусымда № 2-4-113 тіркелді
title:
