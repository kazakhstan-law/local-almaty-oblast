requisite: Алматы облысы Ақсу аудандық мәслихатының 2010 жылғы 23 тамыздағы № 36-225 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 20 қыркүйекте № 2-4-120 тіркелді. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2012 жылғы 23 шілдедегі № 6-59 шешімімен
