requisite: Алматы облысы Ақсу аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 40-253 шешімі. Алматы облысының Әділет департаменті Ақсу ауданының Әділет басқармасында 2010 жылы 30 желтоқсанда № 2-4-124 тіркелді. Күші жойылды - Алматы облысы Ақсу аудандық мәслихатының 2012 жылғы 17 ақпандағы № 2-10 шешімімен
