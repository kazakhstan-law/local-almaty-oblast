act_code: '62446'
requisite: Решение маслихата Аксуского района Алматинской области от 5 декабря 2011 года № 53-316. Зарегистрировано Управлением юстиции Аксуского района Департамента юстиции Алматинской области 29 декабря 2011 года № 2-4-143. Утратило силу решением маслихата Аксуского района Алматинской области от 05 ноября 2012 года № 8-67
title:
  rus: Об установлении специалистам, Аксуского района работающим в сельских населенных пунктах в сфере здравохранения, социального обеспечения, образования, культуры и спорта ежемесячной надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Ақсу ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
