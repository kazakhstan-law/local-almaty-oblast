requisite: Решение маслихата Аксуского района Алматинской области от 22 января 2013 года № 11-87, зарегистрировано Департаментом юстиции Алматинской области 13 февраля 2013 года № 2299. Утратило силу решением Аксуского районного маслихата Алматинской области от 16 октября 2014 года № 34-221
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Аксуского района
  kaz: Ақсу ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
