requisite: Решение маслихата Аксуского района Алматинской области от 22 января 2013 года № 11-86, зарегистрировано Департаментом юстиции Алматинской области 13 февраля 2013 года № 2298. Утратило силу решением Аксуского районного маслихата Алматинской области от 28 июля 2020 года № 62-277
title:
  rus: Об установлении специалистам, здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах Аксуского района, повышенных окладов и тарифных ставок
  kaz: Ақсу ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
