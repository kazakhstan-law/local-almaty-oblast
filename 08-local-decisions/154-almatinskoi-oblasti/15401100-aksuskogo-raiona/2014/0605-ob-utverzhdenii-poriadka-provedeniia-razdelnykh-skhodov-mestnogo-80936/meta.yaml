requisite: Решение Аксуского районного маслихата Алматинской области от 05 июня 2014 года № 32-199. Зарегистрировано Департаментом юстиции Алматинской области 23 июня 2014 года № 2760. Утратило силу решением Аксуского районного маслихата области Жетісу от 15 декабря 2023 года № 19-86
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, огоквартирного жилого дома для участия в сходе местного сообщества в Аксуском районе
  kaz: Ақсу ауданының бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
