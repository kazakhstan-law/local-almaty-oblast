title:
  rus: О признании утратившим силу решения Аксуского районного маслихата от 20 августа 2013 года № 21-141 «Об установлении единых ставок фиксированного налога для всех налогоплательщиков по Аксускому району на 2013-2015 годы»
  kaz: Ақсу аудандық мәслихатының 2013 жылғы 20 тамыздағы «Ақсу ауданы бойынша барлық салық төлеушілер үшін 2013-2015 жылдарға арналған бірыңғай тіркелген салық ставкаларын белгілеу туралы» 21-141 нөмірлі шешімнің күшін жою туралы
