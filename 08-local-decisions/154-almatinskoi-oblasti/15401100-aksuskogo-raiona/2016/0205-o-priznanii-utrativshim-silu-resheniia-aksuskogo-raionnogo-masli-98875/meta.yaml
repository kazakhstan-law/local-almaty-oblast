requisite: Решение Аксуского районного маслихата Алматинской области от 05 февраля 2016 года № 50-302
title:
  rus: О признании утратившим силу решения Аксуского районного маслихата от 9 ноября 2015 года № 45-280 «О повышении ставок земельного налога и единого земельного налога на не используемые земли сельскохозяйственного назначения по Аксускому району»
  kaz: Ақсу аудандық мәслихатының 2015 жылғы 9 қарашадағы «Ақсу ауданы бойынша пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы» 45-280 нөмірлі шешімнің күшін жою туралы
