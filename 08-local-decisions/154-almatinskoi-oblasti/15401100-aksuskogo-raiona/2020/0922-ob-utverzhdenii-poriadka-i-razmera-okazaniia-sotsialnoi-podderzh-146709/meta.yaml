act_code: '146709'
requisite: Решение Аксуского районного маслихата Алматинской области от 22 сентября 2020 года № 66-289. Зарегистрировано Департаментом юстиции Алматинской области 25 сентября 2020 года № 5671
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Аксуского района
  kaz: Ақсу ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету  тәртібін және мөлшерін бекіту туралы
