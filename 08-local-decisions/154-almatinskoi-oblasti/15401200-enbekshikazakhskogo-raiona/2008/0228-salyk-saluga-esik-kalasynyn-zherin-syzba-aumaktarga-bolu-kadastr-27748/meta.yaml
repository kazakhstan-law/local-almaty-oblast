act_code: '27748'
requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2008 жылғы 28 ақпандағы № 11-3 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2008 жылы 04 сәуірде № 2-8-70 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2020 жылғы 21 ақпандағы № 59-164 шешімімен
title:
