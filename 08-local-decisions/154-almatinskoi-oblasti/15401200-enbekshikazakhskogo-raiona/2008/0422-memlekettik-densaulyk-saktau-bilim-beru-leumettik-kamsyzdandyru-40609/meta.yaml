act_code: '40609'
requisite: Алматы облысы Еңбекшіқазақ ауданы мәслихатының 2008 жылғы 22 сәуірдегі № 13-3 шешімі. Алматы облысының әділет департаменті Еңбешіқазақ ауданының Әділет басқармасында 2008 жылы 24 мамырда № 2-8-87 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2013 жылғы 21 желтоқсандағы № 25-8 шешімімен
title:
