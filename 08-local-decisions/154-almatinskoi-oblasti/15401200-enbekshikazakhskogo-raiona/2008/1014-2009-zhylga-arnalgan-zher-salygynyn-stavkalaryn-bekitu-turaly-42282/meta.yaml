requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2008 жылғы 14 қазандағы № 19-3 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2008 жылы 30 қазанда № 2-8-101 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 33-5 шешімімен
