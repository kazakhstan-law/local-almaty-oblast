requisite: Алматы облысы Еңбекшіқазақ аудандық маслихатының 2009 жылғы 31 қаңтардағы № 23-3 шешімі. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының әділет басқармасында 2009 жылы 20 ақпанда № 2-8-106 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық маслихатының 2010 жылғы 14 сәуірдегі № 38-4 шешімімен
