act_code: '46188'
requisite: Алматы облысы Еңбекшіқазақ ауданы Евгенемаловодный селолық округі әкімінің 2009 жылғы 28 сәуірдегі N 27 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2009 жылы 28 мамырда N 2-8-110 тіркелді
