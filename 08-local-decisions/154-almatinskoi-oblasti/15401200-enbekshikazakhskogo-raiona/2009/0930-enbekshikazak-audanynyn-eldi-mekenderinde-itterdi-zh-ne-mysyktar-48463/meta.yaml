act_code: '48463'
requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2009 жылғы 30 қыркүйектегі № 30-4 шешімі. Алматы облысының әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2009 жылы 3 қарашада № 2-8-128 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2012 жылғы 22 тамыздағы № 9-1 шешімімен
