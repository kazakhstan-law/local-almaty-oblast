requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 33-5 шешімі. Алматы облысы Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 29 қаңтарда № 2-8-133 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2014 жылғы 12 мамырдағы № 50-2 шешімімен
