requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 33-1 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2009 жылы 28 желтоқсанда № 2-8-132 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2011 жылғы 17 қаңтардағы № 44-3 шешімімен
