requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2010 жылғы 14 сәуірдегі № 38-3 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 27 мамырда № 2-8-148 тіркелді. Күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2012 жылғы 22 тамыздағы № 9-1 шешімімен
