requisite: Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2010 жылғы 22 желтоқсандағы № 43-1 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 31 желтоқсанда № 2-8-167 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Алматы облысы Еңбекшіқазақ аудандық мәслихатының 2012 жылғы 19 сәуірдегі № 6-12 шешімімен
