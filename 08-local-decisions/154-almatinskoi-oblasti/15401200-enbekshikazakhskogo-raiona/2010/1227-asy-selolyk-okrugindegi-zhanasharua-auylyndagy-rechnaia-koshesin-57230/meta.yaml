act_code: '57230'
requisite: Алматы облысы Еңбекшіқазақ ауданы Асы селолық округі әкімінің 2010 жылғы 27 желтоқсандағы № 46 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2011 жылы 03 ақпанда № 2-8-170 тіркелді
