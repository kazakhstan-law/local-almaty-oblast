act_code: '65738'
requisite: Решение маслихата Енбекшиказахского района Алматинской области от 19 апреля 2011 года № 6-2. Зарегистрировано Управлением юстиции Енбекшиказахского района Департамента юстиции Алматинской области 22 мая 2012 года № 2-8-198. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 27 мая 2015 года № 47-4
title:
  rus: Об установлении специалистам Енбекшиказахского района, работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Еңбекшіқазақ ауданы бойынша ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
