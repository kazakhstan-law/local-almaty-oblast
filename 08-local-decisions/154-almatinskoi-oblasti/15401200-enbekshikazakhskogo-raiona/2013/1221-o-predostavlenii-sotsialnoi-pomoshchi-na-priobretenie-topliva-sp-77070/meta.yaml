act_code: '77070'
requisite: Решение маслихата Енбекшиказахского района Алматинской области от 21 декабря 2013 года № 25-6. Зарегистрировано Департаментом юстиции Алматинской области 21 января 2014 года № 2559. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 15 октября 2014 года № 39-4
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
