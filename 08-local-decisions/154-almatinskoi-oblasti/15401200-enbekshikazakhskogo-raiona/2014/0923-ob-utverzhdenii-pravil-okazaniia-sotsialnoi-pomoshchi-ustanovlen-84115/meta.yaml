  title:
    rus: О внесении изменения и дополнений в решение Енбекшиказахского районного маслихата от 23 сентября 2014 года № 37-3 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий уждающихся граждан по Енбекшиказахскому району"
    kaz: Еңбекшіқазақ аудандық мәслихатының 2014 жылғы 23 қыркүйектегі "Еңбекшіқазақ ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" № 37-3 шешіміне өзгеріс пен толықтырулар енгізу туралы
