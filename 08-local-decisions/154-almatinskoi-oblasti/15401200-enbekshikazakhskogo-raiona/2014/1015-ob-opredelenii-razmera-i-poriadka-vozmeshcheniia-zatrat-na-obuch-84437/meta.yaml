requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 15 октября 2014 года № 39-3. Зарегистрировано Департаментом юстиции Алматинской области 12 ноября 2014 года № 2917. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 21 августа 2017 года № 18-2
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Енбекшиказахском районе
  kaz: Еңбекшіқазақ ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
