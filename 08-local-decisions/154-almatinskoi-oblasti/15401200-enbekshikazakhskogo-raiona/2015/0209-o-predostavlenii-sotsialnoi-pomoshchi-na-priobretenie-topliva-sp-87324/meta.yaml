requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 09 февраля 2015 года № 42-3. Зарегистрировано Департаментом юстиции Алматинской области 27 февраля 2015 года № 3083. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 22 ноября 2019 года № 54-147
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций  социального обеспечения, культуры,  спорта и ветеринарии, проживающим  и работающим в сельских населенных  пунктах Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының ауылдық елді мекендерінде тұратын және жұмыс  істейтін мемлекеттік әлеуметтік  қамсыздандыру, мәдениет, спорт  және ветеринария ұйымдарының  мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
