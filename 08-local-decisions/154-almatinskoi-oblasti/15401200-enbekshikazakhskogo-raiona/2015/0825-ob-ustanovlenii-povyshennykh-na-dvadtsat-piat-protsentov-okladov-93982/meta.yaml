requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 25 августа 2015 года № 50-3. Зарегистрировано Департаментом юстиции Алматинской области 16 сентября 2015 года № 3423. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 22 ноября 2019 года № 54-146
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
