  title:
    rus: О внесении изменений в решение Енбекшиказахского районного маслихата от 23 февраля 2018 года № 24-9 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Енбекшиказахскому району»
    kaz: Еңбекшіқазақ аудандық мәслихатының 2018 жылғы 23 ақпандағы «Еңбекшіқазақ ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 24-9 шешіміне өзгерістер енгізу туралы
