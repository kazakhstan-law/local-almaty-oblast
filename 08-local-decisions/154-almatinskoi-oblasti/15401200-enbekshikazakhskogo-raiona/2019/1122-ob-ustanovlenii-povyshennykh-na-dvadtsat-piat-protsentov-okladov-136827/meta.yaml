act_code: '136827'
requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 22 ноября 2019 года № 54-146. Зарегистрировано Департаментом юстиции Алматинской области 10 декабря 2019 года № 5318. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 28 сентября 2020 года № 68-201
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
