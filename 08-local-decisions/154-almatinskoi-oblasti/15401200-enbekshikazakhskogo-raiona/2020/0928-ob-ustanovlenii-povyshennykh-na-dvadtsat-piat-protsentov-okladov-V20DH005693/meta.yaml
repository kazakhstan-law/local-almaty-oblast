requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 28 сентября 2020 года № 68-201. Зарегистрировано Департаментом юстиции Алматинской области 5 октября 2020 года № 5693. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 30 апреля 2021 года № 6-31
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
