requisite: Решение Енбекшиказахского районного маслихата Алматинской области от 3 декабря 2021 года № 12-65. Утратило силу решением Енбекшиказахского районного маслихата Алматинской области от 26 марта 2024 года № VIII-18-96
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Енбекшиказахском районе
  kaz: Еңбекшіқазақ ауданында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
