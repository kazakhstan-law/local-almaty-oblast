title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Есик и сельских населенных пунктов Енбекшиказахского района
  kaz: Еңбекшіқазақ ауданының жерлерін аймақтарға бөлу жобасын (схемасын) және Есік қаласы мен ауылдық елді мекендердегі бағалау аймақтарының шекаралары мен жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
