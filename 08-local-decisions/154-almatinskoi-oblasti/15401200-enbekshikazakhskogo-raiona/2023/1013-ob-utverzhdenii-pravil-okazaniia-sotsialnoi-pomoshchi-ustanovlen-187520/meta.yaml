  title:
    rus: О внесении изменений  в решение Енбекшиказахского районного маслихата от 13 октября 2023 года № VIII-8-41 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Енбекшиказахского района»
    kaz: Еңбекшіқазақ аудандық мәслихатының 2023 жылғы 13 қазандағы № VIII-8-41 «Еңбекшіқазақ ауданының әлеуметтiк көмек көрсетудің, оның мөлшерлерiн белгiлеудің және мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» шешiмiне өзгерістер енгiзу туралы
