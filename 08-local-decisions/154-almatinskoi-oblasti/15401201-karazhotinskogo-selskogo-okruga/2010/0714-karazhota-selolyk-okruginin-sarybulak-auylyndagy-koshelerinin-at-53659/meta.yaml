act_code: '53659'
requisite: Алматы облысы Еңбекшіқазақ ауданы Қаражота селолық округі әкімінің 2010 жылғы 14 шілдедегі № 07-36 шешімі. Алматы облысының Әділет департаменті Еңбекшіқазақ ауданының Әділет басқармасында 2010 жылы 26 шілдеде № 2-8-158 тіркелді
