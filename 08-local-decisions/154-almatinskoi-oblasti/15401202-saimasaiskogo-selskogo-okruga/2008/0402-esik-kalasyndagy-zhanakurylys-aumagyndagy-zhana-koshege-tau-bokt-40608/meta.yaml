act_code: '40608'
requisite: Алматы облысы Еңбекшіқазақ ауданы Есік қаласы әкімінің 2008 жылғы 2 сәуірдегі № 108 шешімі. Алматы облысының Әділет департаменті Еңбешіқазақ ауданының әділет басқармасында 2008 жылы 7 мамырда № 2-8-85 тіркелді
