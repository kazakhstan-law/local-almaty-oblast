act_code: '40598'
requisite: Алматы облысы Еңбекшіқазақ ауданы Есік қаласы әкімінің 2008 жылғы 2 сәуірдегі № 107 шешімі. Алматы облысының Әділет департаменті Еңбешіқазақ ауданының Әділет басқармасында 2008 жылы 7 мамырда № 2-8-75 тіркелді
