requisite: Алматы облысы Талғар аудандық мәслихатының 2009 жылғы 25 ақпандағы N 17-99 шешімі. Алматы облысының Әділет департаменті Талғар ауданының Әділет басқармасында 2009 жылы 26 наурызда N 2-18-81 тіркелді. Күші жойылды - Алматы облысы Талғар аудандық мәслихатының 2010 жылғы 11 ақпандағы № 28-172 шешімімен
