requisite: Алматы облысы Талғар аудандық мәслихатының 2009 жылғы 22 сәуірдегі N 20-114 шешімі. Алматы облысының Әділет департаменті Талғар ауданының Әділет басқармасында 2009 жылы 23 сәуірде N 2-18-82 тіркелді. Күші жойылды - Алматы облысы Талғар аудандық мәслихатының 2010 жылғы 11 ақпандағы № 28-172 шешімімен
