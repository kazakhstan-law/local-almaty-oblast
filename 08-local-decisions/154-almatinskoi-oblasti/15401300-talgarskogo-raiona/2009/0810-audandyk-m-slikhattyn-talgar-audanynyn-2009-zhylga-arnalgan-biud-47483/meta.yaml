requisite: Алматы облысы Талғар аудандық мәслихатының 2009 жылғы 10 тамыздағы № 23-136 шешімі. Алматы облысының Әділет департаменті Талғар ауданының Әділет басқармасында 2009 жылдың 20 тамызында № 2-18-89 тіркелді. Күші жойылды - Алматы облысы Талғар аудандық мәслихатының 2010 жылғы 11 ақпандағы № 28-172 шешімімен
