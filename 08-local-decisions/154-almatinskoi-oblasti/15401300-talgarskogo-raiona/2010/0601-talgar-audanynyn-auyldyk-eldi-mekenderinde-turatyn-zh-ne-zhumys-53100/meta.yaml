requisite: Алматы облысы Талғар аудандық мәслихатының 2010 жылғы 1 маусымдағы № 32-197 шешімі. Алматы облысы Талғар ауданының Әділет басқармасында 2010 жылғы 15 маусымда № 2-18-108 тіркелді. Күші жойылды - Алматы облысы Талғар аудандық мәслихатының 2011 жылғы 08 сәуірдегі № 45-264 шешімімен
title:
  rus: Талғар ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін 2010 жылға әлеуметтік көмек беру туралы
