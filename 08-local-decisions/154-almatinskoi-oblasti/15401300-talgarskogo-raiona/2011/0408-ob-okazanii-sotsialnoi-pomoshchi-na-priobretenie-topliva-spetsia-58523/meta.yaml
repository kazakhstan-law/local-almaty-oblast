requisite: Решение маслихата Талгарского района Алматинской области от 08 апреля 2011 года № 45-264. Зарегистрировано Управлением юстиции Талгарского района Департамента юстиции Алматинской области 28 апреля 2011 года № 2-18-128. Утратило силу решением Талгарского районного маслихата Алматинской области от 06 ноября 2012 года № 10-57
title:
  rus: Об оказании социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах Талгарского района
  kaz: Талғар ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
