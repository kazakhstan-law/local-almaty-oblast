  title:
    rus: О внесении изменений в решение Талгарского районного маслихата от 13 апреля 2012 года N 4-24 "Об установлении надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате специалистам работающим в сельских населенных пунктах Талгарского района в сфере здравоохранения, социального обеспечения, образования, культуры и спорта"
    kaz: Талғар аудандық мәслихатының 2012 жылғы 13 сәуірдегі "Талғар ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы" N 4-24 шешіміне өзгерістер енгізу туралы
