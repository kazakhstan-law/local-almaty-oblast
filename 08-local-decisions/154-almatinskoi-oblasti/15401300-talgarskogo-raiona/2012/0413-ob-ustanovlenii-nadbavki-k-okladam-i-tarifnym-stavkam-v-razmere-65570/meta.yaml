requisite: Решение маслихата Талгарского района Алматинской области от 13 апреля 2012 года № 4-24. Зарегистрировано Управлением юстиции Талгарского района Департамента юстиции Алматинской области 14 мая 2012 года № 2-18-146. Утратило силу решением Талгарского районного маслихата Алматинской области от 31 марта 2015 года № 41-252
title:
  rus: Об установлении надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате специалистам работающим в сельских населенных пунктах Талгарского района в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии
  kaz: Талғар ауданы бойынша ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғарғы айлықақы мен тарифтік ставкалар белгілеу туралы
