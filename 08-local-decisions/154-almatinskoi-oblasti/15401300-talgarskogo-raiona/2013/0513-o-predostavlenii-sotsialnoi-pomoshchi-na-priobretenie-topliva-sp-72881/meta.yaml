requisite: Решение маслихата Талгарского района Алматинской области от 13 мая 2013 года № 17-87. Зарегистрировано Департаментом юстиции Алматинской области 30 мая 2013 года № 2360. Утратило силу решением маслихата Талгарского района Алматинской области от 27 сентября 2013 года № 22-120
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Талгарского района
  kaz: Талғар ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
