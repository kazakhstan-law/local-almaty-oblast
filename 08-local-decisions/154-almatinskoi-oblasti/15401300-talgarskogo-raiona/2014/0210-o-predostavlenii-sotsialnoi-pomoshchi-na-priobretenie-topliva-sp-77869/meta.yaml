requisite: Решение маслихата Талгарского района Алматинской области от 10 февраля 2014 года № 28-148. Зарегистрировано Департаментом юстиции Алматинской области 07 марта 2014 года № 2605. Утратило силу решением Талгарского районного маслихата Алматинской области от 15 октября 2014 года № 36-213
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Талгарского района
  kaz: Талғар ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт  және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
