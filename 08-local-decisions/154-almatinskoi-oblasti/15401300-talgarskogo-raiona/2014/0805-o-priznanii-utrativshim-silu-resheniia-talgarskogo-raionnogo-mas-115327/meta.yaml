title:
  rus: О признании утратившим силу решения Талгарского районного маслихата от 10 апреля 2013 года № 16-80 «Об утверждении границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки в населенных пунктах Талгарского района»
  kaz: Талғар аудандық мәслихатының 2013 жылы 10 сәуірдегі «Талғар ауданының елді мекендеріндегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэфициенттерін бекіту туралы» № 16-80 шешімінің күшін жою туралы
