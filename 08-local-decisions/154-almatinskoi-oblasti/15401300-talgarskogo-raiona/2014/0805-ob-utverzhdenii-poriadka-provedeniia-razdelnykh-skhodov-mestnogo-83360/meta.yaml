requisite: Решение Талгарского районного маслихата Алматинской области от 5 августа 2014 года № 34-193. Зарегистрировано Департаментом юстиции Алматинской области 11 сентября 2014 года № 2849. Утратило силу решением Талгарского районного маслихата Алматинской области от 22 декабря 2023 года № 15-61
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества  и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Талгарском районе
  kaz: Талғар ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және  жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын  үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
