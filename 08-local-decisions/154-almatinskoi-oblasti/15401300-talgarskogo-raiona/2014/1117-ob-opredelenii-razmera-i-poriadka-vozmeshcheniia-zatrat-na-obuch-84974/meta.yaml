requisite: Решение Талгарского районного маслихата Алматинской области от 17 ноября 2014 года № 37-215. Зарегистрировано Департаментом юстиции Алматинской области 03 декабря 2014 года № 2953. Утратило силу решением Талгарского районного маслихата Алматинской области от 06 мая 2016 года № 3-17
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Талгарском районе
  kaz: Талғар ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
