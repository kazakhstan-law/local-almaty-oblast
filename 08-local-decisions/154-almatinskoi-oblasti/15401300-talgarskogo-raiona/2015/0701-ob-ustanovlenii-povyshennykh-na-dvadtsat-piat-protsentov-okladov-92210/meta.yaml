requisite: Решение Талгарского районного маслихата Алматинской области от 01 июля 2015 года № 45-267. Зарегистрировано Департаментом юстиции Алматинской области 22 июля 2015 года № 3298. Утратило силу решением Талгарского районного маслихата Алматинской области от 30 сентября 2020 года № 63-266
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Талгарского района
  kaz: Талғар ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласындағы мамандарға  жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
