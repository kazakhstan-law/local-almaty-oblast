requisite: Решение Талгарского районного маслихата Алматинской области от 30 сентября 2020 года № 63-266. Зарегистрировано Департаментом юстиции Алматинской области 8 октября 2020 года № 5703
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Талгарского района
  kaz: Талғар ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт саласындағы мамандарға, жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
