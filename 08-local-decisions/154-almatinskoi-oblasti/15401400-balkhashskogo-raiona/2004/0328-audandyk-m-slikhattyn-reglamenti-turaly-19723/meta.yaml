requisite: Алматы облысы Балқаш аудандық мәслихатының 2004 жылғы 29 наурыздағы № 7-34 шешімі. Алматы облыстық Әділет департаментінде 2004 жылы 28 сәуірде № 1597 тіркелді. Күші жойылды - Алматы облысы Балқаш аудандық мәслихатының 2007 жылғы 24 қаңтардағы № 48-204 шешімімен
