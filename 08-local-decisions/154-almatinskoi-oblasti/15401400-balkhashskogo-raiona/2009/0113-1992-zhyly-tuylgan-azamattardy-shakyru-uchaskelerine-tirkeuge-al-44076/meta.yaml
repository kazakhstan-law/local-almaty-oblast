requisite: Алматы облысы Балқаш ауданы әкімінің 2009 жылғы 13 қаңтардағы № 1-2 шешімі. Алматы облысының Әділет департаменті Балқаш ауданының әділет басқармасында 2009 жылы 6 ақпанда № 2-6-53 тіркелді. Күші жойылды - Алматы облысы Балқаш ауданы әкімінің 2009 жылғы 17 маусымдағы № 6-8 шешімімен
