requisite: Алматы облысы Балқаш аудандық мәслихатының 2009 жылғы 28 желтоқсандағы № 26-133 шешімі. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 06 ақпанда № 2-6-63 тіркелді. Күші жойылды - Алматы облысы Балқаш аудандық мәслихатының 2011 жылғы 28 наурыздағы № 44-209 шешімімен
