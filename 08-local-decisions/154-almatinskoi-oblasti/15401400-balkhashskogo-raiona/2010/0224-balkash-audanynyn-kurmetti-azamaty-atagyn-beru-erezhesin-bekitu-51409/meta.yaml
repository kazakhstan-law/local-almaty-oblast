requisite: Алматы облысы Балқаш аудандық мәслихатының 2010 жылғы 24 ақпандағы № 28-144 шешімі. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 25 наурызда № 2-6-68 тіркелді. Күші жойылды - Алматы облысы Балқаш аудандық мәслихатының 2011 жылғы 18 қарашадағы № 55-257 шешімімен
