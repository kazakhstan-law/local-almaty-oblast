requisite: Алматы облысы Балқаш аудандық мәслихатының 2010 жылғы 19 сәуірдегі № 30-160 шешімі. Алматы облысының Әділет департаменті Балқаш ауданының Әділет басқармасында 2010 жылы 28 мамырда № 2-6-71 тіркелді. Күші жойылды - Алматы облысы Балқаш аудандық мәслихатының 2012 жылғы 31 шілдедегі № 7-43 шешімімен
