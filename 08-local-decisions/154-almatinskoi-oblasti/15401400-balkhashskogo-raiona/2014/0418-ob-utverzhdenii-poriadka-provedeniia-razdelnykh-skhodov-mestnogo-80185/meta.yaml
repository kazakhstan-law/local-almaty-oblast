act_code: '80185'
requisite: Решение Балхашского районного маслихата Алматинской области от 18 апреля 2014 года N 32-139. Зарегистрировано Департаментом юстиции Алматинской области 14 мая 2014 года N 2699. Утратило силу решением Балхашского районного маслихата Алматинской области от 14 октября 2024 года № 26-102
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, огоквартирного жилого дома для участия в сходе местного сообщества в Балхашском районе
  kaz: Балқаш ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
