requisite: Решение Балхашского районного маслихата Алматинской области от 24 ноября 2014 года № 39-168. Зарегистрировано Департаментом юстиции Алматинской области 8 декабря 2014 года № 2956. Утратило силу решением Балхашского районного маслихата Алматинской области от 17 июля 2017 года № 20-93
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Балхашском районе
  kaz: Балқаш ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
