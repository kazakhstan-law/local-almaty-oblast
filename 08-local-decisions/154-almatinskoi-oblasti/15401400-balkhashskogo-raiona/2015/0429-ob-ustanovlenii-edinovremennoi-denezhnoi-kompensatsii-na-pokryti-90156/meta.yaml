requisite: Решение Балхашского районного маслихата Алматинской области от 29 апреля 2015 года № 43-188. Зарегистрировано Департаментом юстиции Алматинской области 25 мая 2015 года № 3179. Утратило силу решением Балхашского районного маслихата Алматинской области от 9 марта 2022 года № 17-72
title:
  rus: Об установлении единовременной денежной компенсации на покрытие расходов за коммунальные услуги и на приобретение топлива для отопления жилых помещений педагогическим работникам образования, работающим в сельской местности
  kaz: Ауылдық жерде жұмыс істейтін білім берудің педагог қызметкерлеріне коммуналдық қызмет көрсетулерге шығыстарды жабуға және тұрғын үй-жайларды жылыту үшін отын сатып алуға біржолғы ақшалай  өтемақы белгілеу туралы
