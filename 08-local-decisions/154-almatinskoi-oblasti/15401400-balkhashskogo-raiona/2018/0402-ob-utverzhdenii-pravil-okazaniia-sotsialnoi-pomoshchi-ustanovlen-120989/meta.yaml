  title:
    rus: О внесении изменения в решение Балхашского районного маслихата от 2 апреля  2018 года № 29-134 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Балхашского района»
    kaz: Балқаш аудандық мәслихатының 2018 жылғы 2 сәуірдегі «Балқаш ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 29-134 шешіміне өзгерістер енгізу туралы
