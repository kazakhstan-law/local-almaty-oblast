act_code: '126378'
requisite: Решение Балхашского районного маслихата Алматинской области от 22 ноября 2018 года № 38-176. Зарегистрировано Департаментом юстиции Алматинской области 4 декабря 2018 года № 4920
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Балхашскому району
  kaz: Балқаш ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
