  title:
    rus: О внесении изменений и дополнений в решение Балхашского районного маслихата от 6 октября 2023 года № 9-33 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Балхашского района»
    kaz: Балқаш аудандық мәслихатының «Балқаш ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 6 қазандағы № 9-33 шешіміне өзгерістер мен толықтырулар енгiзу туралы
