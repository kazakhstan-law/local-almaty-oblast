requisite: Решение Балхашского районного маслихата Алматинской области от 24 сентября 2025 года № 41-144
title:
  rus: «Об утверждении норм образования и накопления коммунальных отходов в Балхашском районе и тарифов на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов для населения по району»
  kaz: «Балқаш ауданында коммуналдық қалдықтардың түзілу және жинақталу нормаларын және аудан бойынша халық үшін қатты тұрмыстық қалдықтарды жинауға, тасымалдауға, сұрыптауға және көмуге арналған тарифтерін бекіту туралы»
