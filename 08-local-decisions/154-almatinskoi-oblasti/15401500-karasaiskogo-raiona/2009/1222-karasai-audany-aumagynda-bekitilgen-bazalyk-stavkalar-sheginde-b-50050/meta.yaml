requisite: Алматы облысы Қарасай аудандық мәслихатының 2009 жылғы 22 желтоқсандағы № 36-3 шешімі. Алматы облысы Қарасай ауданының Әділет басқармасында 2010 жылғы 19 қаңтарда № 2-11-79 тіркелді. Күші жойылды - Алматы облысы Қарасай аудандық мәслихатының 2011 жылғы 10 наурыздағы № 51-5 шешімімен
