requisite: Алматы облысы Қарасай ауданы мәслихатының 2010 жылғы 16 сәуірдегі № 39-9 шешімі. Алматы облысы Қарасай ауданының Әділет басқармасында 2010 жылғы 26 мамырда № 2-11-90 тіркелді. Күші жойылды - Алматы облысы Қарасай аудандық мәслихатының 2012 жылғы 13 тамыздағы № 9-5 шешімімен
