requisite: Решение маслихата Карасайского района Алматинской области от 08 июня 2012 года № 7-4. Зарегистрировано Управлением юстиции Карасайского района Департамента юстиции Алматинской области 18 июня 2012 года № 2-11-122. Утратило силу решением Карасайского районного маслихата Алматинской области от 06 ноября 2012 года № 12-14
title:
  rus: Об установлении специалистам Карасайского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта ежемесячной надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Қарасай ауданы бойынша ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақылар мен тарифтік ставкалар белгілеу туралы
