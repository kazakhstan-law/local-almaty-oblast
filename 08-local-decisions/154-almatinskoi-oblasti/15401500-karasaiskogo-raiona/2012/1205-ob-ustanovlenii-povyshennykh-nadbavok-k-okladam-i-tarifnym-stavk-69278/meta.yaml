requisite: Решение маслихата Карасайского района Алматинской области от 05 декабря 2012 года № 13-4. Зарегистрировано Департаментом юстиции Алматинской области 14 декабря 2012 года № 2248
title:
  rus: Об установлении повышенных надбавок к окладам и тарифным ставкам в размере двадцати пяти процентов специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельских населенных пунктах Карасайского района
  kaz: Қарасай ауданының ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент мөлшерінде жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
