requisite: Решение маслихата Карасайского района Алматинской области от 09 декабря 2013 года № 25-7. Зарегистрировано Департаментом юстиции Алматинской области 23 декабря 2013 года № 2529. Утратило силу решением Карасайского районного маслихата Алматинской от 07 августа 2015 № 45-5
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельской местности
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
