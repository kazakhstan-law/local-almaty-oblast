act_code: '80309'
requisite: Решение Карасайского районного маслихата Алматинской области от 18 апреля 2014 года № 29-7. Зарегистрировано Департаментом юстиции Алматинской области 23 мая 2014 года № 2734. Утратило силу решением Карасайского районного маслихата Алматинской области от 26 декабря 2023 года № 13-5
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многквартирного жилого дома для участия в сходе местного сообщества в Карасайском Районе
  kaz: Қарасай ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
