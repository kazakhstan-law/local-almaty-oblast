requisite: Решение Карасайского районного маслихата Алматинской области от 20 мая 2016 года № 5-4. Зарегистрировано Департаментом юстиции Алматинской области 14 июня 2016 года № 3888. Утратило силу решением Карасайского районного маслихата Алматинской области от 4 ноября 2020 года № 61-4
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Карасайском районе
  kaz: Қарасай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
