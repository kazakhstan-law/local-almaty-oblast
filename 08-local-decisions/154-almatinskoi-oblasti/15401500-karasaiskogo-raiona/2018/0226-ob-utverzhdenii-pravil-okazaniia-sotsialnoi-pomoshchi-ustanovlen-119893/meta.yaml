  title:
    rus: О внесении изменений в решение Карасайского районного маслихата  от 26 февраля 2018 года № 25-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Карасайского района»
    kaz: Қарасай аудандық мәслихатының 2018 жылғы 26 ақпандағы «Қарасай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 25-4 шешіміне өзгерістер енгізу туралы
