act_code: '140132'
requisite: Решение Карасайского районного маслихата Алматинской области от 3 марта 2020 года № 52-4. Зарегистрировано Департаментом юстиции Алматинской области 11 марта 2020 года № 5435. Утратило силу решением Карасайского районного маслихата Алматинской области от 28 сентября 2020 года № 59-5
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта, ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах, а также указанным специалистам, работающим в государственных организациях, финансируемых из местных бюджетов Карасайского района
  kaz: Қарасай ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт, ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласындағы мамандарға, сондай-ақ жергілікті бюджеттерден қаржыландырылатын мемлекеттік ұйымдарда жұмыс істейтін аталған мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
