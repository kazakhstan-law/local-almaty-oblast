act_code: '147067'
requisite: Решение Карасайского районного маслихата Алматинской области от 28 сентября 2020 года № 59-5. Зарегистрировано Департаментом юстиции Алматинской области 5 октября 2020 года № 5688
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры являющимся гражданскими служащими и работающим в сельских населенных пунктах Карасайского района
  kaz: Қарасай ауданында азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
