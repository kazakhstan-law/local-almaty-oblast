  code: '161062'
  requisite: Решение Карасайского районного маслихата Алматинской области от 12 ноября 2021 года № 12-4. Зарегистрировано в Министерстве юстиции Республики Казахстан 2 декабря 2021 года № 25504
  title:
    rus: О внесении изменений в решение Карасайского районного маслихата от 28 сентября 2020 года № 59-5 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Карасайского района»
    kaz: Қарасай аудандық мәслихатының 2020 жылғы 28 қыркүйектегі № 59-5 «Қарасай ауданында азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы» шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/161062/rus
