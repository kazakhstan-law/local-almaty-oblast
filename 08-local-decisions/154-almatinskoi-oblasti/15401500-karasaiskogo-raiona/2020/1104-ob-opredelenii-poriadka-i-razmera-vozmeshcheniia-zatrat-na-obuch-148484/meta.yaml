    kaz: Қарасай аудандық мәслихатының 2020 жылғы 4 қарашадағы № 61-4 «Қарасай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
