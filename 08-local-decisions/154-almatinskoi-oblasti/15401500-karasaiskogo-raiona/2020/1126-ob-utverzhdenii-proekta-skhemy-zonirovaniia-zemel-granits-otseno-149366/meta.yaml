title:
  rus: Об утверждении проекта (схемы) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Каскелен и сельских населенных пунктов Карасайского района
  kaz: Қарасай ауданының жерлерін аймақтарға бөлу жобасын (схемасын), Қаскелең қаласы мен ауылдық елді мекендердегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
