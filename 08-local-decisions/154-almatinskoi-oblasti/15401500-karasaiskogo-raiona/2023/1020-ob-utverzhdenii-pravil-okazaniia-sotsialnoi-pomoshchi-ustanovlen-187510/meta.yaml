  title:
    rus: О внесении изменении в решение Карасайского районного маслихата от 20 октября 2023 года № 8-3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Карасайского района»
    kaz: Қарасай аудандық мәслихатының 2023 жылғы 20 қазандағы № 8-3 «Қарасай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешiмiне өзгерістер енгiзу туралы
