  title:
    rus: О внесении изменений и дополнений в решение Карасайского районного маслихата от 20 октября 2023 года № 8-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Карасайского района»
    kaz: Қарасай аудандық мәслихатының 2023 жылғы 20 қазандағы «Қарасай ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 8-3 шешіміне өзгерістер мен толықтырлар енгізу туралы
