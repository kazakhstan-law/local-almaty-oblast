requisite: Алматы облысы Райымбек аудандық мәслихатының 2003 жылғы 9 маусымдағы N 34-127 шешімі. Алматы облыстық Әділет басқармасында 2003 жылы 16 маусымда N 1212 тіркелді. Күші жойылды - Алматы облысы Райымбек аудандық мәслихатының 2005 жылғы 14 қарашадағы N 26-107 шешімімен
