requisite: Алматы облысы Райымбек ауданы әкімінің 2009 жылғы 12 қаңтардағы № 1-1 шешімі. Алматы облысының әділет департаменті Райымбек ауданының әділет басқармасында 2009 жылы 17 ақпанда № 2-15-65 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімінің 2009 жылғы 23 маусымдағы № 6-19 шешімімен
