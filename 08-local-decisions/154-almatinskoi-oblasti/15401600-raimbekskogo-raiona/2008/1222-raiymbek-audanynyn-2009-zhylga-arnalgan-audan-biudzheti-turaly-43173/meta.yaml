requisite: Алматы облысы Райымбек аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № 17-83 шешімі. Алматы облысының әділет департаменті Райымбек ауданының әділет басқармасында 2009 жылғы 8 қаңтарда № 2-15-64 тіркелді. Күші жойылды - Алматы облысы Райымбек аудандық мәслихатының 2010 жылғы 19 наурыздағы № 35-180 шешімімен
