requisite: Райымбек аудандық мәслихатының 2009 жылғы 22 мамырдағы № 25-128 шешімі. Алматы облысы Райымбек ауданының Әділет басқармасында 2009 жылғы 3 маусымда № 2-15-72 тіркелді. Күші жойылды - Алматы облысы Райымбек аудандық мәслихатының 2012 жылғы 05 қарашадағы № 8-52 шешімімен
title:
  rus: Райымбек ауданындағы ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет ұйымдарының мамандарына отын сатып алу үшін бюджет қаражаты есебінен әлеуметтік көмек беру туралы
