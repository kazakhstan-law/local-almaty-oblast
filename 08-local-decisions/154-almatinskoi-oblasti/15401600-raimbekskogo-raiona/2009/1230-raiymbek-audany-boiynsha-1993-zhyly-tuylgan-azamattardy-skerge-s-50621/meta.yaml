requisite: Алматы облысы Райымбек ауданы әкімінің 2009 жылғы 30 желтоқсандағы № 12-32 шешімі. Алматы облысы Райымбек ауданының Әділет басқармасында 2010 жылғы 9 ақпанда № 2-15-78 тіркелді. Күші жойылды - Алматы облысы Райымбек ауданы әкімінің 2011 жылғы 20 қаңтардағы № 1-02 шешімімен
