act_code: '62865'
requisite: Решение маслихата Райымбекского района Алматинской области от 20 декабря 2011 года № 61-301. Зарегистрировано Управлением юстиции Райымбекского района Департамента юстиции Алматинской области 16 января 2012 года № 2-15-111. Утратило силу - Решением маслихата Райымбекского района Алматинской области от 05 ноября 2012 года № 8-51
title:
  rus: Об установлении специалистам Райымбекского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта ежемесячной надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Райымбек ауданы бойынша  ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
