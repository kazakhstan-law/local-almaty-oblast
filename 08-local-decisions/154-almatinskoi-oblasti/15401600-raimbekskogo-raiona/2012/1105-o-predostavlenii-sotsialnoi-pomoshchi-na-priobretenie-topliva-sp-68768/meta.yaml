act_code: '68768'
requisite: Решение маслихата Райымбекского района Алматинской области от 05 ноября 2012 года № 8-52. Зарегистрировано Департаментом юстиции Алматинской области 23 ноября 2012 года № 2198. Утратило силу решением Райымбекского районного маслихата Алматинской области от 05 ноября 2014 года № 37-197
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, образования, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Райымбекского района
  kaz: Райымбек ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
