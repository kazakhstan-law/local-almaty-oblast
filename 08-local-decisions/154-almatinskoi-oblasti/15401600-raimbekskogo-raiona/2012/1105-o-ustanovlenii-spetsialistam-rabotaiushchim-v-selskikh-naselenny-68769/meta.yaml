act_code: '68769'
requisite: Решение маслихата Райымбекского района Алматинской области от 05 ноября 2012 года № 8-51. Зарегистрировано Департаментом юстиции Алматинской области 23 ноября 2012 года № 2199. Утратило силу решением Райымбекского районного маслихата Алматинской области от 3 августа 2020 года № 71-344
title:
  rus: О установлении специалистам работающим в сельских населенных пунктах здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии Райымбекского района повышенные надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Райымбек ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
