act_code: '79089'
requisite: Решение маслихата Райымбекского района Алматинской области от 05 марта 2014 года N 26-134. Зарегистрировано Департаментом юстиции Алматинской области 15 апреля 2014 года N 2670. Утратило силу решением Райымбекского районного маслихата Алматинской области от 21 декабря 2023 года № 15-86
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного  жилого дома для участия в сходе местного сообщества в Райымбекском районе
  kaz: Райымбек ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және  жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын  үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
