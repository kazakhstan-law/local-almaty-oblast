title:
  rus: 'О предоставлении социальной  помощи на приобретение топлива  специалистам государственных  организаций социального обеспечения,  культуры, спорта и ветеринарии, проживающим и работающим  в сельских населенных пунктах  Райымбекского района '
  kaz: 'Райымбек ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы  '
