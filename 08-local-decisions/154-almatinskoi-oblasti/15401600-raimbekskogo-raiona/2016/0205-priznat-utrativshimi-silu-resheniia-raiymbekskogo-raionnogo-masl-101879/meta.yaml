act_code: '101879'
requisite: Решение Райымбекского районного маслихата Алматинской области от 05 февраля 2016 года № 55-286
title:
  rus: Признать утратившими силу решения Райымбекского районного маслихата от 8 февраля 2010 года № 34-169 "Об утверждении уменьшении установленных размеров базовых ставок земельного налога микрорайонов на основании проекта (схемы) деления на окрестности земельных участков Райымбекского района" и решения Райымбекского районного маслихата от 28 октября 2015 года № 49-260 "О повышении ставок земельного налога и единого земельного налога на не используемые земли сельскохозяйственного назначения по Райымбекскому району"
  kaz: Райымбек аудандық мәслихатының 2010 жылғы 8 ақпандағы "Райымбек ауданы жерлерін аймаққа бөлу жобасы (схемасы) негізінде жер салығының базалық ставкаларын ықшамдаудың нақты мөлшерін бекіту туралы" № 34-169 шешімінің және 2015 жылғы 28 қазандағы "Райымбек ауданы бойынша пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының және бірыңғай жер салығының мөлшерлемелерін жоғарылату туралы" № 49-260 шешімінің күшін жою туралы
