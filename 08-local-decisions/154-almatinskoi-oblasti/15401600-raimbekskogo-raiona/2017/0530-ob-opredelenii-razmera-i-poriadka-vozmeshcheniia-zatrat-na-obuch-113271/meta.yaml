requisite: Решение Райымбекского районного маслихата Алматинской области от 30 мая 2017 года № 17-96. Зарегистрировано Департаментом юстиции Алматинской области 16 июня 2017 года № 4233. Утратило силу решением Райымбекского районного маслихата Алматинской области от 6 февраля 2024 года № 18-104
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Райымбекском районе
  kaz: Райымбек ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
