  title:
    rus: О внесении изменений и дополнения в решение Райымбекского районного маслихата от 15 марта 2018 года № 34-160 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Райымбекского района»
    kaz: Райымбек аудандық мәслихатының 2018 жылғы 15 наурыздағы № 34-160 «Райымбек ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
