title:
  rus: Об утверждении проекта (схемы) зонирования земель Райымбекского района, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки сельских населенных пунктов Райымбекского района
  kaz: Райымбек ауданының жерлерін аймақтарға бөлу жобасын (схемасын), Райымбек ауданының ауылдық елді мекендеріндегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
