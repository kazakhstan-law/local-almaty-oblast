requisite: Решение Райымбекского районного маслихата Алматинской области от 14 ноября 2023 года № 13-73. Зарегистрировано Департаментом юстиции Алматинской области 22 ноября 2023 года № 6050-05. Утратило силу решением Райымбекского районного маслихата Алматинской области от 27 марта 2025 года № 40-215 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
