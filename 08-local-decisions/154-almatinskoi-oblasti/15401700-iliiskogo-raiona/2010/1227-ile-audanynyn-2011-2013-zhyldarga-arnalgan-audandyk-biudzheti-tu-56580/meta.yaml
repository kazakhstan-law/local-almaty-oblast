requisite: Алматы облысы Іле аудандық мәслихатының 2010 жылғы 27 желтоқсандағы № 39-157 шешімі. Алматы облысының Әділет департаменті Іле ауданының Әділет басқармасында 2010 жылы 31 желтоқсанда № 2-10-137 тіркелді. Күші жойылды - Алматы облысы Іле аудандық мәслихатының 2012 жылғы 24 қаңтардағы № 1-6 шешімімен
