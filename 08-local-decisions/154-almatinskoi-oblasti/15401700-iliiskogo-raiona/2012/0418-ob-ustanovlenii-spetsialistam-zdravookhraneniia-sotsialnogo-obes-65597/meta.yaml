requisite: Решение маслихата Илийского района Алматинской области от 18 апреля 2012 года № 6-23. Зарегистрировано Управлением юстиции Илийского района Департамента юстиции Алматинской области 14 мая 2012 года № 2-10-159. Утратило силу решением Илийского районного маслихата Алматинской области от 5 ноября 2012 года № 11-52
title:
  rus: Об установлении специалистам здравоохранения, социального обеспечения, образования, культуры и спорта, работающих в сельских населенных пунктах Илийского района повышенные на двадцать пять процентов оклады и тарифные ставки
  kaz: Іле ауданының ауылдық елді мекендерінде жұсмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
