act_code: '69277'
requisite: Решение маслихата Илийского района Алматинской области от 07 декабря 2012 года № 12-54. Зарегистрировано Департаментом юстиции Алматинской области 14 декабря 2012 года № 2247. Утратило силу решением Илийского районного маслихата Алматинской области от 27 мая 2015 года № 46-217
title:
  rus: Об установлении специалистам работающим в сельских населенных пунктах Илийского района в сфере здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии повышенные надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов к заработной плате
  kaz: Іле ауданының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарының еңбекақысына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
