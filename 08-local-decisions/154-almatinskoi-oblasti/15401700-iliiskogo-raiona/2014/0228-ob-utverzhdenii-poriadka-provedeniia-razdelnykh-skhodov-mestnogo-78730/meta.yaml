requisite: Решение маслихата Илийского района Алматинской области от 28 февраля 2014 года № 29-137. Зарегистрировано Департаментом юстиции Алматинской области 04 апреля 2014 года № 2643. Утратило силу решением Илийского районного маслихата Алматинской области от 17 ноября 2021 года № 12-45
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Илийском районе
  kaz: Іле ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
