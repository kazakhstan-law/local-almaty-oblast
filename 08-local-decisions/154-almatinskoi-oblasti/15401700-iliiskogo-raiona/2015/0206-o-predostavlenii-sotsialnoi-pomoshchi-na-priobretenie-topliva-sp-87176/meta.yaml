requisite: Решение Илийского районного маслихата Алматинской области от 06 февраля 2015 года № 43-197. Зарегистрировано Департаментом юстиции Алматинской области 05 марта 2015 года № 3089. Утратило силу решением Илийского районного маслихата Алматинской области от 14 февраля 2020 года № 51-228
title:
  rus: О предоставлении социальной  помощи на приобретение топлива  специалистам государственных  организаций социального обеспечения,  культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Илийского района
  kaz: Іле ауданының ауылдық елді  мекендерде тұратын және жұмыс  істейтін мемлекеттік әлеуметтік  қамсыздандыру, мәдениет, спорт  және ветеринария ұйымдарының  мамандарына отын сатып алу үшін  әлеуметтік көмек беру туралы
