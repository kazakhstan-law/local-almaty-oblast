act_code: '93483'
requisite: Решение Илийского районного маслихата Алматинской области от 30 июля 2015 года № 47-220. Зарегистрировано Департаментом юстиции Алматинской области 27 августа 2015 года № 3366. Утратило силу решением Илийского районного маслихата Алматинской области от 17 марта 2021 года № 3-10
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Илийского района
  kaz: Іле ауданының азаматтық қызметші болып табылатын және ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтiк мөлшерлемелер белгiлеу туралы
