requisite: Решение маслихата Илийского района Алматинской области от 26 декабря 2016 года № 10-49. Зарегистрировано Департаментом юстиции Алматинской области 12 января 2017 года № 4063. Утратило силу решением Илийского районного маслихата Алматинской области от 5 ноября 2020 года № 65-261
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Илийском районе
  kaz: Іле ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
