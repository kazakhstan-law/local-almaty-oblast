  title:
    rus: О внесении изменений и дополнения в решение Илийского районного маслихата от 5 ноября 2020 года № 65-261 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Илийском районе»
    kaz: Іле аудандық мәслихатының 2020 жылғы 5 қарашадағы № 65-261 «Іле ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
