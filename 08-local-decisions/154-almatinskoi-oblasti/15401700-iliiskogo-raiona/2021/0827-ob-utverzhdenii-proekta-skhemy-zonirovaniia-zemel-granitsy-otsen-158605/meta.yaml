title:
  rus: Об утверждении проекта (схемы) зонирования земель, границы оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки населенных пунктов Илийского района
  kaz: Іле ауданының жерлерін аймақтарға бөлу жобасын (схема), елді мекендердегі бағалау аймақтарының шекаралары және жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту туралы
