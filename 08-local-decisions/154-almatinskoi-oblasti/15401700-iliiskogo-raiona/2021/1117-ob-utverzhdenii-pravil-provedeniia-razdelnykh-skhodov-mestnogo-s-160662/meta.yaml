requisite: Решение Илийского районного маслихата Алматинской области от 17 ноября 2021 года № 12-45. Утратило силу решением Илийского районного маслихата Алматинской области от 14 февраля 2024 года № 19-60
title:
  rus: Об утверждении правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Илийском районе
  kaz: Іле ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау қағидаларын бекіту туралы
