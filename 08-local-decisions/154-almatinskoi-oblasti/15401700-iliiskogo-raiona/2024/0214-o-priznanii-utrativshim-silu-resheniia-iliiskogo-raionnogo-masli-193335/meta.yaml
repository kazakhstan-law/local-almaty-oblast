act_code: '193335'
requisite: Решение Илийского районного маслихата Алматинской области от 14 февраля 2024 года № 19-60
title:
  rus: О признании утратившим силу решения Илийского районного маслихата от 17 ноября 2021 года № 12-45 «Об утверждении Порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Илийском районе»
  kaz: Іле аудандық мәслихатының 2021 жылғы 17 қарашадағы №12-45 «Іле ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы» шешімінің күшін жою туралы
