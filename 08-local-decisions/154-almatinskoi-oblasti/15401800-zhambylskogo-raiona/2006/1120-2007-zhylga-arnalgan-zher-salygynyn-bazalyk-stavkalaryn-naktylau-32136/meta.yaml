requisite: Алматы облысы Жамбыл аудандық мәслихатының 2006 жылғы 20 қарашадағы № 60-216 шешімі. Алматы облысының Әділет департаменті Жамбыл ауданының Әділет басқармасында 2006 жылғы 14 желтоқсанда № 2-7-34 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2007 жылғы 24 желтоқсандағы № 6-25 шешімімен
