requisite: Алматы облысы Жамбыл аудандық мәслихатының 2009 жылғы 13 сәуірдегі № 22-93 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 27 сәуірде № 2-7-76 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2010 жылғы 6 қаңтардағы № 32-140 шешімімен
title:
