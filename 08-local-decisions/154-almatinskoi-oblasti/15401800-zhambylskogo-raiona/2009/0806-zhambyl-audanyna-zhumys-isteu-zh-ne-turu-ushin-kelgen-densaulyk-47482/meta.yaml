requisite: Алматы облысы Жамбыл аудандық мәслихатының 2009 жылғы 6 тамыздағы № 26-111 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 20 тамызда № 2-7-80 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2010 жылғы 6 қаңтардағы № 32-140 шешімімен
