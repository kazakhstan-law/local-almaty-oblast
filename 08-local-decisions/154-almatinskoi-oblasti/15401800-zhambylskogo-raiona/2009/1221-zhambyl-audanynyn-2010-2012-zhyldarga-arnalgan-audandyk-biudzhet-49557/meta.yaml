requisite: Алматы облысы Жамбыл аудандық мәслихатының 2009 жылғы 21 желтоқсандағы № 31-130 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 28 желтоқсанда № 2-7-83 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Жамбыл аудандық мәслихатының 2013 жылғы 22 сәуірдегі № 16-133 шешімімен
