requisite: Алматы облысы Жамбыл ауданы мәслихатының 2010 жылғы 5 ақпандағы № 33-143 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 9 наурызда № 2-7-89 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2011 жылғы 17 ақпандағы № 49-224 шешімімен
title:
  rus: Жамбыл ауданына жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына көтерме жәрдемақы мен тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
