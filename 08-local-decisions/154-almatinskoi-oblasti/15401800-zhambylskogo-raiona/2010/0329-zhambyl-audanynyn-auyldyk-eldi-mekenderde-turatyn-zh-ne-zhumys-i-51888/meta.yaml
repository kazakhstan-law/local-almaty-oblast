requisite: Алматы облысы Жамбыл ауданы мәслихатының 2010 жылғы 29 наурыздағы № 36-160 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 19 сәуірде № 2-7-96 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2012 жылғы 13 сәуірдегі № 6-55 шешімімен
title:
  rus: Жамбыл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
