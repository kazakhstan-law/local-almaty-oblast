requisite: Алматы облысы Жамбыл ауданы мәслихатының 2010 жылғы 16 сәуірдегі № 37-168 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 28 мамырда № 2-7-98 тіркелді. Күші жойылды - Алматы облысы Жамбыл аудандық мәслихатының 2012 жылғы 11 маусымдағы № 8-69 шешімімен
