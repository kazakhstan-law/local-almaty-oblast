act_code: '57703'
requisite: Алматы облысы Жамбыл ауданы мәслихатының 2011 жылғы 17 ақпандағы № 49-224 шешімі. Алматы облысы Жамбыл ауданының Әділет басқармасында 2011 жылғы 15 наурызда № 2-7-117 тіркелді
title:
