requisite: Решение маслихата Жамбылского района Алматинской области от 13 апреля 2012 года № 6-56. Зарегистрировано Управлением юстиции Жамбылского района Департамента юстиции Алматинской области 27 апреля 2012 года № 2-7-140. Утратило силу - Решением маслихата Жамбылского района Алматинской области от 23 ноября 2012 года № 12-100
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры и спорта, проживающим и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
