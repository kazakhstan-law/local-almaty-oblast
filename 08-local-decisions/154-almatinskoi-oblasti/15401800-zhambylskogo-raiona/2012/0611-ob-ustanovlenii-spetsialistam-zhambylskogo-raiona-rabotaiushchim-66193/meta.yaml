requisite: Решение маслихата Жамбылского района Алматинской области от 11 июня 2012 года № 8-65. Зарегистрировано Управлением юстиции Жамбылского района Департамента юстиции Алматинской области 18 июня 2012 года № 2-7-141. Утратило силу - Решением маслихата Жамбылского района Алматинской области от 23 ноября 2012 года № 12-99
title:
  rus: Об установлении специалистам Жамбылского района работающим в сельских населенных пунктах в сфере здравоохранения, социального обеспечения, образования, культуры и спорта надбавки к окладам и тарифным ставкам в размере  двадцати пяти процентов к заработной плате
  kaz: Жамбыл ауданы бойынша ауылдық елдi мекендерде жұмыс iстейтiн денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет және спорт мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
