requisite: Решение маслихата Жамбылского района Алматинской области от 23 ноября 2012 года № 12-100. Зарегистрировано Департаментом юстиции Алматинской области 10 декабря 2012 года № 2219. Утратило силу решением Жамбылского районного маслихата Алматинской области от 15 октября 2014 года № 38-266
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
