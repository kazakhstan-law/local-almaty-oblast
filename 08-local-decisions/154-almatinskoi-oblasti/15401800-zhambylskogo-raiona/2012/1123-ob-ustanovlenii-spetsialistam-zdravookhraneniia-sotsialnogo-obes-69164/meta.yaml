act_code: '69164'
requisite: Решение маслихата Жамбылского района Алматинской области от 23 ноября 2012 года № 12-99. Зарегистрировано Департаментом юстиции Алматинской области 10 декабря 2012 года № 2220
title:
  rus: Об установлении специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии работающим в сельских населенных пунктах Жамбылского района надбавки к окладам и тарифным ставкам в размере двадцати пяти процентов
  kaz: Жамбыл ауданының ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент мөлшерінде жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
