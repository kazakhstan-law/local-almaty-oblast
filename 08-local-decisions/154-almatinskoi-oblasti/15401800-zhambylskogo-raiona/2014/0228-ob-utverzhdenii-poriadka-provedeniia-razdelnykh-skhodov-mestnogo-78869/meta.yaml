requisite: Решение маслихата Жамбылского района Алматинской области от 28 февраля 2014 года № 30-205. Зарегистрировано Департаментом юстиции Алматинской области 10 апреля 2014 года № 2648. Утратило силу решением Жамбылского районного маслихата Алматинской области от 1 февраля 2024 года № 14-68
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, могоквартирного жилого дома для участия в сходе местного сообщества в Жамбылском районе
  kaz: Жамбыл ауданында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
