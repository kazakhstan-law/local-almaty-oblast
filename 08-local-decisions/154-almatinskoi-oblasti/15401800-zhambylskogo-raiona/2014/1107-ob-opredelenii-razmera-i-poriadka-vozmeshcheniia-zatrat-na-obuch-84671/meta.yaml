requisite: Решение Жамбылского районного маслихата Алматинской области от 7 ноября 2014 года № 39-270. Зарегистрировано Департаментом юстиции Алматинской области 26 ноября 2014 года № 2926. Утратило силу решением Жамбылского районного маслихата Алматинской области от 26 августа 2016 года № 6-36
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жамбылском районе
  kaz: Жамбыл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
