requisite: Решение Жамбылского районного маслихата Алматинской области от 27 мая 2015 года № 47-322. Зарегистрировано Департаментом юстиции Алматинской области 22 июня 2015 года № 3240. Утратило силу решением Жамбылского районного маслихата Алматинской области от 13 февраля 2020 года № 67-309
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
