requisite: Решение Жамбылского районного маслихата Алматинской области от 23 июля 2015 года № 49-331. Зарегистрировано Департаментом юстиции Алматинской области 14 августа 2015 года № 3337. Утратило силу решением Жамбылского районного маслихата Алматинской области от 26 декабря 2019 года № 64-299
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
