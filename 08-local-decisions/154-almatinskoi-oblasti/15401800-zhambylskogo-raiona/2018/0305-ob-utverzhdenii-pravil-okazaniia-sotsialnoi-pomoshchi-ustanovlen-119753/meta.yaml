  title:
    rus: О внесении изменений в решение Жамбылского районного маслихата  от 05 марта 2018 года № 29-155 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жамбылского района»
    kaz: Жамбыл аудандық мәслихатының 2018 жылғы 05 наурыздағы «Жамбыл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 29-155 шешіміне өзгерістер енгізу туралы
