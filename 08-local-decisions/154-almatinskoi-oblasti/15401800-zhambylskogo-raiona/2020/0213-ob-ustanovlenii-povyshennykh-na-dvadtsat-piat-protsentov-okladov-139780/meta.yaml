act_code: '139780'
requisite: Решение Жамбылского районного маслихата Алматинской области от 13 февраля 2020 года № 67-309. Зарегистрировано Департаментом юстиции Алматинской области 20 февраля 2020 года № 5425. Утратило силу решением Жамбылского районного маслихата Алматинской области от 15 марта 2021 года № 3-15
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, лесного хозяйства и особо охраняемых природных территорий, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жамбылского района
  kaz: Жамбыл ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария, орман шаруашылығы және ерекше қорғалатын табиғи аумақтар саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
