  title:
    rus: О внесении изменений в решение Жамбылского районного маслихата от 28 сентября 2023 года № 7-32 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Жамбылского района»
    kaz: Жамбыл аудандық мәслихатының «Жамбыл ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 28 қыркүйектегі № 7-32 шешіміне өзгерістер енгізу туралы
