requisite: Алматы облысы Текелі қалалық мәслихатының 2007 жылғы 29 маусымдағы № 12-183 шешімі. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2007 жылғы 18 шілдеде № 2-3-34 тіркелген. Күші жойылды - Алматы облысы Текелі қалалық мәслихатының 2012 жылғы 12 маусымдағы № 7-46 шешімімен
