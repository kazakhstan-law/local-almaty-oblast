requisite: Алматы облысы Текелі қалалық мәслихатының 2008 жылғы 31 қаңтардағы № 3-27 шешімі. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2008 жылы 5 наурызда № 2-3-42 тіркелді. Күші жойылды - Алматы облысы Текелі қалалық мәслихатының 2011 жылғы 15 шілдедегі № 34-268 шешімімен
