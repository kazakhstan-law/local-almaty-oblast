requisite: Алматы облысы Текелі қаласы әкімінің 2009 жылғы 5 қаңтардағы № 3 шешімі. Алматы облысының Әділет департаменті Текелі қаласының әділет басқармасында 2009 жылы 20 қаңтарда № 2-3-56 тіркелді. Күші жойылды - Алматы облысы Текелі қаласы әкімінің 2009 жылғы 25 желтоқсандағы № 5 шешімімен
