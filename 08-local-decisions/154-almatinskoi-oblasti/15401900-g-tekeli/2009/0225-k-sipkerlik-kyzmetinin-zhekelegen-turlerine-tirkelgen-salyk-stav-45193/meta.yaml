requisite: Алматы облысының Текелі қалалық мәслихатының 2009 жылғы 25 ақпандағы № 8-81 шешімі. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2009 жылы 2 сәуірде № 2-3-60 тіркелді. Күші жойылды - Алматы облысының Текелі қалалық мәслихатының 2009 жылғы 20 желтоқсандағы № 15-139 шешімімен
