requisite: Алматы облысы Текелі қаласы әкімінің 2009 жылғы 25 желтоқсандағы № 5 шешімі. Алматы облысының Әділет департаменті Текелі қаласының әділет басқармасында 2010 жылы 26 қаңтарда № 2-3-73 тіркелді. Күші жойылды - Алматы облысының Текелі қаласы әкімінің 2010 жылғы 20 желтоқсандағы № 7 шешімімен
