requisite: Алматы облысының Текелі қаласы әкімінің 2010 жылғы 20 желтоқсандағы № 7 шешімі. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2011 жылы 18 қаңтарда № 2-3-88 тіркелді. Күші жойылды - Алматы облысы Текелі қаласының әкімінің 2012 жылғы 28 ақпандағы № 3 шешімімен
