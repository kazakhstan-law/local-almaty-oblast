requisite: Алматы облысының Текелі қалалық мәслихатының 2010 жылғы 20 желтоқсандағы № 27-201 шешімі. Алматы облысының Әділет департаменті Текелі қаласының Әділет басқармасында 2010 жылы 29 желтоқсанда № 2-3-87 тіркелді. Қолданылу мерзiмiнің аяқталуына байланысты шешімнің күші жойылды - Алматы облысының Текелі қалалық мәслихатының 2012 жылғы 17 ақпандағы № 3-23 шешімімен
