act_code: '76113'
requisite: Решение маслихата города Текели Алматинской области от 26 ноября 2013 года № 23-142. Зарегистрировано Департаментом юстиции Алматинской области 13 декабря 2013 года № 2522. Утратило силу решением маслихата города Текели Алматинской области от 19 декабря 2014 года № 36-230
title:
  rus: Об установлении специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающим в сельских населенных пунктах города Текели, повышенных окладов и тарифных ставок
  kaz: Текелі қаласының ауылдық елді мекендерінде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
