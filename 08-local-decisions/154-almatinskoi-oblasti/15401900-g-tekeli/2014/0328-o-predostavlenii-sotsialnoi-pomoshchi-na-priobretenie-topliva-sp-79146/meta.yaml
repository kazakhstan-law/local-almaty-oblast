requisite: Решение Текелийского городского маслихата Алматинской области от 28 марта 2014 года № 27-175. Зарегистрировано Департаментом юстиции Алматинской области 17 апреля 2014 года № 2674. Утратило силу решением Текелийского городского маслихата Алматинской области от 16 октября 2014 года № 34-219
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах города Текели
  kaz: Текелі қаласының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
