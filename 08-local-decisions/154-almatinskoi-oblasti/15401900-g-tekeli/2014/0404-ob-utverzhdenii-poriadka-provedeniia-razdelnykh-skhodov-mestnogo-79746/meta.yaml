act_code: '79746'
requisite: Решение Текелийского городского маслихата Алматинской области от 04 апреля 2014 года N 28-183. Зарегистрировано Департаментом юстиции Алматинской области 24 апреля 2014 года N 2682. Утратило силу решением маслихата города Текели области Жетісу от 14 ноября 2023 года № 10-57
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества  и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в городе Текели
  kaz: Текелі қаласында бөлек жергілікті қоғамдастық жиындарын өткізу және  жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі  тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
