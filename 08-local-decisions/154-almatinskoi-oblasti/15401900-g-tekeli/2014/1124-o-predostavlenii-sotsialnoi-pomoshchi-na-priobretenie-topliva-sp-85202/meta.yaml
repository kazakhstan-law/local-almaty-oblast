requisite: Решение Текелийского городского маслихата Алматинской области от 24 ноября 2014 года N 35-225. Зарегистрировано Департаментом юстиции Алматинской области 11 декабря 2014 года N 2960. Утратило силу решением Текелийского городского маслихата Алматинской области от 20 июля 2016 года № 6-30
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах города Текели
  kaz: Текелі қаласының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
