requisite: Решение Текелийского городского маслихата Алматинской области от 24 ноября 2014 года № 35-224. Зарегистрировано Департаментом юстиции Алматинской области 11 декабря 2014 года № 2959. Утратило силу решением Текелийского городского маслихата Алматинской области от 02 августа 2016 года № 7-37
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Текели
  kaz: Текелі қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
