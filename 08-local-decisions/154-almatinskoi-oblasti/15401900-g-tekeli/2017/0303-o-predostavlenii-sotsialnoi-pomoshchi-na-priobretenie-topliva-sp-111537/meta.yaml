requisite: Решение Текелийского городского маслихата Алматинской области от 3 марта 2017 года № 13-77. Зарегистрировано Департаментом юстиции Алматинской области 12 апреля 2017 года № 4185. Утратило силу решением Текелийского городского маслихата Алматинской области от 8 апреля 2020 года № 46-273
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, культуры, спорта и ветеринарии, проживающим и работающим в сельском населенном пункте города Текели
  kaz: Текелі қаласының ауылдық елді мекенінде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
