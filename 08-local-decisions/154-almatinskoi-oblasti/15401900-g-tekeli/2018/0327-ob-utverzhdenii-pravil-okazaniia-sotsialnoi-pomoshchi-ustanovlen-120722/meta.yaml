requisite: Решение Текелийского городского маслихата Алматинской области от 27 марта 2018 года № 23-151. Зарегистрировано Департаментом юстиции Алматинской области 12 апреля 2018 года № 4635. Утратило силу решением маслихата города Текели области Жетісу от 26 декабря 2023 года № 11-65
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Текели
