  title:
    rus: О внесении изменений и дополнения в решение Текелийского городского маслихата от 27 марта 2018 года № 23-151 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Текели»
    kaz: Текелі қалалық мәслихатының 2018 жылғы 27 наурыздағы № 23-151 «Текелі қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
