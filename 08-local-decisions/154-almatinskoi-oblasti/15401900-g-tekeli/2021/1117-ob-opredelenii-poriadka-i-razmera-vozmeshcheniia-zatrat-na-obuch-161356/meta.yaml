requisite: Решение маслихата города Текели Алматинской области от 17 ноября 2021 года № 10-40. Зарегистрировано в Министерстве юстиции Республики Казахстан 8 декабря 2021 года № 25630. Утратило силу решением маслихата города Текели области Жетісу от 14 ноября 2023 года № 10-56
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Текели
  kaz: Текелі қаласында мүгедектер қатарындағы кемтар балаларды  жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
