requisite: Алматы облысы Қапшағай қалалық мәслихатының 2008 жылғы 21 ақпандағы № 50-9 шешімі. Алматы облысының Әділет департаменті Қапшағай қаласының Әділет басқармасында 2008 жылдың 18 наурызында № 2-2-61 тіркелді. Күші жойылды - Алматы облысы Қапшағай қалалық мәслихатының 2011 жылғы 28 қарашадағы № 303-61 шешімімен
