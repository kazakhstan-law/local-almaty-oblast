act_code: '44545'
requisite: Алматы облысы Қапшағай қалалық мәслихатының 2009 жылғы 18 ақпандағы № 126-23 шешімі. Алматы облысының Әділет департаменті Қапшағай қаласының Әділет басқармасында 2009 жылдың 27 ақпанында № 2-2-77 тіркелді. Күші жойылды - Қапшағай қалалық мәслихатының 2009 жылғы 26 наурыздағы № 136-24 шешімімен
