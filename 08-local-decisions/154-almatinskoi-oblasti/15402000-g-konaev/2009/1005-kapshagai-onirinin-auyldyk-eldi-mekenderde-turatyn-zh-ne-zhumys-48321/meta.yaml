requisite: Алматы облысы Қапшағай қалалық мәслихатының 2009 жылғы 05 қазандағы № 165-30 шешімі. Алматы облысы Қапшағай қаласының Әділет басқармасында 2009 жылдың 28 қазанында № 2-2-92 тіркелді. Қолданылу мерзімінің аяқталуына байланысты шешімнің күші жойылды - Алматы облысы Қапшағай қалалық мәслихатының 2013 жылғы 15 мамырдағы № 16-83 шешімімен
