act_code: '66659'
requisite: Решение маслихата города Капшагай Алматинской области от 08 июня 2012 года № 4-28. Зарегистрировано Управлением юстиции города Капшагай Департамента юстиции Алматинской области 12 июля 2012 года № 2-2-140. Утратило силу решением Капшагайского городского маслихата Алматинской области от 29 декабря 2014 года № 43-184
title:
  rus: Об установлении специалистам здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, работающих в сельских населенных пунктах города Капшагая повышенные на двадцать пять процентов оклады и тарифные ставки
  kaz: Қапшағай қаласының ауылдық елді мекендерде жұмыс істейтін денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария мамандарына жиырма бес процент жоғары айлықақы мен тарифтік ставкалар белгілеу туралы
