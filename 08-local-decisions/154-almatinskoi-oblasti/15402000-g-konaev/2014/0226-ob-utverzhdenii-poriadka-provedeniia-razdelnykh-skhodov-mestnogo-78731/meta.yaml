act_code: '78731'
requisite: Решение маслихата города Капшагай Алматинской области от 26 февраля 2014 года N 29-129. Зарегистрировано Департаментом юстиции Алматинской области 04 апреля 2014 года N 2644. Утратило силу решением маслихата города Қонаев Алматинской области от 2 февраля 2024 года № 18-66
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в городе Капшагай
  kaz: Қапшағай қаласында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көп пәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібін бекіту туралы
