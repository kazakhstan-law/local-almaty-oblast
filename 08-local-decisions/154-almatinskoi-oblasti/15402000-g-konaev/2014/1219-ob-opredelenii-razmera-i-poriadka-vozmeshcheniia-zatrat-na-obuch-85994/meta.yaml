requisite: Решение Капшагайского городского маслихата Алматинской области от 19 декабря 2014 года № 42-178. Зарегистрировано Департаментом юстиции Алматинской области 14 января 2015 года № 2996. Утратило силу решением Капшагайского городского маслихата Алматинской области от 20 июня 2016 года № 5-29
title:
  rus: Об определении размера и порядка  возмещения затрат на обучение на  дому детей с ограниченными  возможностями из числа  инвалидов по индивидуальному  учебному плану города Капшагай
