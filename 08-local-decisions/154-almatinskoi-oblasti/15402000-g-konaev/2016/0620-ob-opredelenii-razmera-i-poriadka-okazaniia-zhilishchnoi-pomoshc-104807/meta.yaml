  title:
    rus: О внесении изменений в решение Капшагайского городского маслихата от 20 июня 2016 года № 5-28 «Об определении размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) по городу Капшагай»
    kaz: Қапшағай қалалық мәслихатының 2016 жылғы 20 маусымдағы № 5-28 «Қапшағай қаласы бойынша аз қамтылған отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
