requisite: Решение Капшагайского городского маслихата Алматинской области от 20 июня 2016 года № 5-29. Зарегистрировано Департаментом юстиции Алматинской области 19 июля 2016 года № 3900. Утратило силу решением маслихата города Қонаев Алматинской области от 24 октября 2023 года № 11-37
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в городе Капшагай
  kaz: Қапшағай қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
