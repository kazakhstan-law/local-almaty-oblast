  requisite: Решение Капшагайского городского маслихата Алматинской области от 18 июля 2019 года № 54-201. Зарегистрировано Департаментом юстиции Алматинской области 22 июля 2019 года № 4848. Утратило силу решением маслихата города Қонаев Алматинской области от 24 октября 2023 года № 11-38
  title:
    rus: О внесении изменений в решение Капшагайского городского маслихата от 14 февраля 2018 года № 31-143 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Капшагай»
    kaz: Қапшағай қалалық мәслихатының 2018 жылғы 14 ақпандағы «Қапшағай қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 31-143 шішіміне өзгерістер енгізу туралы
