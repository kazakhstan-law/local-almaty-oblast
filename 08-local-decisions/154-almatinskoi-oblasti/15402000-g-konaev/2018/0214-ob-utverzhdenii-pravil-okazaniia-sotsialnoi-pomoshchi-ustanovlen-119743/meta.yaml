  requisite: Решение Капшагайского городского маслихата Алматинской области от 27 марта 2020 года № 67-250. Зарегистрировано Департаментом юстиции Алматинской области 3 апреля 2020 года № 5446. Утратило силу решением маслихата города Қонаев Алматинской области от 24 октября 2023 года № 11-38
  title:
    rus: О внесении изменений и дополнений в решение Капшагайского городского маслихата от 14 февраля 2018 года № 31-143 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Капшагай»
    kaz: Қапшағай қалалық мәслихатының 2018 жылғы 14 ақпандағы «Қапшағай қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» № 31-143 шешіміне өзгерістер мен толықтырулар енгізу туралы
