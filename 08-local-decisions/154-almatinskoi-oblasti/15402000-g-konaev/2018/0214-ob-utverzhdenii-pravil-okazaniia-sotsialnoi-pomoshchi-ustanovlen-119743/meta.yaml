requisite: Решение Капшагайского городского маслихата Алматинской области от 14 февраля 2018 года № 31-143. Зарегистрировано Департаментом юстиции Алматинской области 12 марта 2018 года № 4545. Утратило силу решением маслихата города Қонаев Алматинской области от 24 октября 2023 года № 11-38
title:
  rus: Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Капшагай
  kaz: Қапшағай қаласының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы
