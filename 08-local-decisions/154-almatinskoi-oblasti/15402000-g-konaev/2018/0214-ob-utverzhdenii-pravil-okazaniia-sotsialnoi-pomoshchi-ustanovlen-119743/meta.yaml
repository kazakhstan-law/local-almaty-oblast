  title:
    rus: О внесении изменений в решение Капшагайского городского маслихата от 14 февраля 2018 года № 31-143 «Об утверждении правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Капшагай»
    kaz: Қапшағай қалалық мәслихатының 2018 жылғы 14 ақпандағы № 31-143 «Қапшағай қаласының әлеуметтiк көмек көрсетудің, оның мөлшерлерiн белгiлеудің және мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекiту туралы» шешiмiне өзгерістер енгiзу туралы
