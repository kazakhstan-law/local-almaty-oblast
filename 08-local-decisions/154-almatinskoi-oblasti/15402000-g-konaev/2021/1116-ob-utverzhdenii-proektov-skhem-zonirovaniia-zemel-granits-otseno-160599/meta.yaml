act_code: '160599'
requisite: Решение Капшагайского городского  маслихата Алматинской области от 16 ноября 2021 года № 14-44. Зарегистрировано в Министерстве юстиции Республики Казахстан 23 ноября 2021 года № 25324
title:
  rus: Об утверждении  проектов (схем) зонирования земель, границ оценочных зон и поправочных коэффициентов к базовым ставкам платы за земельные участки города Капшагай и населенных пунктов Заречного, Шенгельдинского сельских округов
  kaz: Қапшағай қаласы және Заречный, Шеңгелді ауылдық округтерінің елді мекендерінің  жерлерін аймақтарға бөлу жобаларын (схемаларын), бағалау аймақтарының шекараларын және  жер учаскелері үшін төлемақының базалық ставкаларына түзету коэффициенттерін бекіту  туралы
