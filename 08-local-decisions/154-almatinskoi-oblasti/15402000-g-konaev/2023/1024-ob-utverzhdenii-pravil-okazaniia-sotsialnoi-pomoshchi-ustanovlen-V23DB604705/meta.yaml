  title:
    rus: О внесении изменений и дополнений в решение маслихата города Қонаев от 24 октября 2023 года № 11-38 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан города Қонаев»
    kaz: «Қонаев қаласы әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Қонаев қалалық мәслихатының 2023 жылғы 24 қазандағы № 11-38 шешіміне өзгерістер мен толықтырулар енгізу туралы
