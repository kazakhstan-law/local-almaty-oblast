act_code: '222312'
requisite: Решение акима города Қонаев Алматинской области от 12 февраля 2026 года № 2-4
title:
  rus: О признании утратившим силу решения акима города Қонаев от 17 декабря 2025 года № 12-15 «Об объявлении на территории города Қонаев Алматинской области чрезвычайной ситуации природного характера местного масштаба»
  kaz: «Алматы облысы Қонаев қаласының аумағында жергілікті ауқымдағы табиғи сипаттағы төтенше жағдай жариялау туралы» Қонаев қаласы әкімінің 2025 жылғы 17 желтоқсандағы № 12-15 шешімінің күшін жою туралы
