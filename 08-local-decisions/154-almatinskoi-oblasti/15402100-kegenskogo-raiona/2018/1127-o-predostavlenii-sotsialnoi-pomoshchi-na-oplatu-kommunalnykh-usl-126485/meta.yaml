requisite: Решение Кегенского районного маслихата Алматинской области от 27 ноября 2018 года № 9-32. Зарегистрировано Департаментом юстиции Алматинской области 29 ноября 2018 года № 4901. Утратило силу решением Кегенского районного маслихата Алматинской области от 19 августа 2020 года № 38-131
title:
  rus: О предоставлении социальной помощи на оплату коммунальных услуг и приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Кегенского района
  kaz: Кеген ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу үшін әлеуметтік көмек беру туралы
