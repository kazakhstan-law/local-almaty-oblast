  title:
    rus: О внесении изменений в решение Кегенского районного маслихата от 1 октября 2020 года № 41-140 «Об определении специализированных мест для организации и проведения мирных собраний, порядка использования специализированных мест для организации и проведения мирных собраний, нормы их предельной заполняемости, а также требований к материально-техническому и организационному обеспечению специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в Кегенском районе»
    kaz: Кеген аудандық мәслихатының 2020 жылғы 1 қазандағы «Кеген ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін, олардың шекті толу нормаларын, сондай-ақ бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар мен пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» № 41-140 шешіміне өзгерістер енгізу туралы
