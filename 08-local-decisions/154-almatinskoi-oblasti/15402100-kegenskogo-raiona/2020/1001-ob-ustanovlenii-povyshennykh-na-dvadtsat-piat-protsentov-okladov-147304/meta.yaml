act_code: '147304'
requisite: Решение Кегенского районного маслихата Алматинской области от 1 октября 2020 года № 41-141. Зарегистрировано Департаментом юстиции Алматинской области 8 октября 2020 года № 5704
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, образования, культуры, спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Кегенского района
  kaz: Кеген ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
