  title:
    rus: О внесении изменении и дополнении в решение Кегенского районного маслихата от 19 октября 2023 года № 11-52 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Кегенского района»
    kaz: Кеген аудандық мәслихатының 2023 жылғы 19 қазандағы № 11-52 «Кеген ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
