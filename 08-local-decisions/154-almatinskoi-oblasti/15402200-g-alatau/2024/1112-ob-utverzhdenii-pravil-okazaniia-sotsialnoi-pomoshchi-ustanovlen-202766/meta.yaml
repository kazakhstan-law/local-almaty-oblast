  title:
    rus: О внесении изменений в решение маслихата города Алатау от 12 ноября 2024 года № 11-35 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан города Алатау»
    kaz: Алатау қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Алатау қалалық мәслихатының 2024 жылғы 12 қарашадағы № 11-35 шешіміне өзгерістер енгізу туралы
